<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>umi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --deep:#04111C;--wave:#1A7A9A;--foam:#AADDEE;--white:#FFFFFF;
  --sea:#22CCEE;--river:#44BB88;--city:#FFAA44;--ground:#FF7766;
  --r:16px;
}
html,body{height:100%;background:var(--deep);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden}

/* ONBOARDING */
#ob{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 28px) 28px calc(env(safe-area-inset-bottom,0px) + 28px);z-index:1000;background:linear-gradient(180deg,#0A3A6A 0%,#1A6A9A 30%,#3A9AC0 60%,#8CCFE8 80%,#1A4A6A 100%)}
#ob-logo{font-size:32px;font-weight:300;letter-spacing:.2em;color:var(--foam);margin-bottom:20px;flex-shrink:0}
#ob>*{flex-shrink:0}
.ob-row{display:flex;align-items:flex-start;gap:14px;width:100%;max-width:320px;margin-bottom:16px}
.ob-ic{width:34px;height:34px;border-radius:50%;background:rgba(26,122,154,.25);border:1px solid rgba(170,221,238,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--foam)}
.ob-tx{font-size:12px;color:var(--foam);line-height:1.6}
.ob-axis{margin:0 0 18px;padding:12px 14px;border-radius:12px;background:rgba(4,17,28,.35);border:1px solid rgba(255,210,122,.35)}
.ob-axis-t{font-size:15px;font-weight:500;color:#FFE3A8;line-height:1.5}
.ob-axis-d{font-size:12px;color:var(--foam);line-height:1.6;margin-top:4px}
.ob-h{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.6);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12)}
.ob-row+.ob-h{margin-top:6px}
.ob-cat{display:block;font-size:10px;letter-spacing:.08em;font-weight:600;line-height:1.4}
.ob-mini{display:flex;flex-direction:column;gap:8px}
.ob-mini-row{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.92)}
.ob-mini-ic{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--foam);background:rgba(26,122,154,.25);border:1px solid rgba(170,221,238,.3)}
.ob-tx strong{font-size:14px;font-weight:500}
.ob-tx strong{color:var(--white)}
#inp-nick:focus,#inp-pin:focus{border-color:rgba(26,122,154,.6)!important}
#ob-btn{width:100%;max-width:320px;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;font-family:'Inter',sans-serif}

/* MAP */
#app{position:fixed;inset:0;display:none;flex-direction:column;background:linear-gradient(180deg,#0A3A6A 0%,#1A6A9A 30%,#3A9AC0 60%,#8CCFE8 80%,#1A4A6A 100%)}
#app.show{display:flex}
#map{flex:1;position:relative;z-index:1}
.leaflet-container{z-index:1}
#leafmap{position:absolute;inset:0}
/* 仕様のさりげない案内（左上） */
#spec-tip{
  position:absolute;left:12px;top:calc(var(--hdr-h,96px) + 6px);z-index:25;
  max-width:calc(100% - 190px);min-width:0;
  display:flex;align-items:flex-start;gap:7px;text-align:left;
  padding:6px 11px 6px 8px;border-radius:16px;
  background:rgba(6,22,36,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(170,221,238,.18);color:#fff;font-family:inherit;cursor:pointer;
  transition:opacity .5s ease, max-width .3s ease;-webkit-tap-highlight-color:transparent;
}
#spec-tip.fade{opacity:0}
#spec-tip.open{z-index:40;background:rgba(6,22,36,.85)} /* 幅は変えずに折り返す（右上のクレジットに重ねない） */
.st-ic{flex-shrink:0;width:16px;height:16px;margin-top:1px;color:var(--foam)}
.st-ic svg{width:16px;height:16px}
.st-body{display:flex;flex-direction:column;min-width:0}
.st-t{font-size:11px;line-height:1.45;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-d{display:none;font-size:11px;line-height:1.5;color:var(--foam);margin-top:2px}
#spec-tip.open .st-t{white-space:normal}
#spec-tip.open .st-d{display:block}

/* 集計画面・撮り方（全画面シート） */
.sheet{position:fixed;inset:0;z-index:5000;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#06192A 0%,#04111C 100%);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet.show{display:block}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-title{font-size:18px;font-weight:500;letter-spacing:.06em}
.sheet-x{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:22px;line-height:1;cursor:pointer}
.seg-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.seg-lbl{font-size:11px;color:var(--foam);width:40px;flex-shrink:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 12px;border-radius:14px;border:1px solid rgba(170,221,238,.3);background:transparent;color:rgba(255,255,255,.8);font-family:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:rgba(95,211,230,.22);border-color:#5FD3E6;color:#fff}
.sum-hero{margin:18px 0 6px;padding:18px 16px;border-radius:16px;background:rgba(255,170,68,.08);border:1px solid rgba(255,170,68,.35)}
.sum-hero-l{font-size:12px;color:rgba(255,255,255,.75)}
.sum-hero-n{font-size:46px;font-weight:600;color:#FFAA44;line-height:1.1;margin:4px 0}
.sum-hero-n small{font-size:16px;font-weight:500;margin-left:4px}
.sum-hero-n .pre{font-size:15px;font-weight:500;margin-right:6px;color:rgba(255,255,255,.85)}
.sum-hero-s{font-size:12px;color:rgba(255,255,255,.7);line-height:1.6}
.sum-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 6px;background:rgba(255,255,255,.08)}
.sum-bar span{display:block;height:100%}
.sum-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:rgba(255,255,255,.75)}
.sum-leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sum-sec{margin-top:20px}
.sum-h{font-size:11px;letter-spacing:.1em;color:rgba(170,221,238,.8);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.sum-side{display:flex;gap:8px}
.sum-side>div{flex:1;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.sum-side .k{font-size:11px;color:rgba(255,255,255,.65);line-height:1.4}
.sum-side .v{font-size:18px;font-weight:600;margin-top:4px}
.sum-side .v small{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.6)}
.sum-note{font-size:11px;color:rgba(255,255,255,.55);line-height:1.6;margin-top:14px}
.tr-mark{margin:8px 0 4px;padding-left:10px;border-left:3px solid #5FD3E6;font-size:11px;color:#9EE7F2}
.ms-row{padding:10px 12px;border-radius:12px;background:rgba(95,211,230,.06);border:1px solid rgba(95,211,230,.25);margin-bottom:8px}
.ms-t{font-size:14px;font-weight:500}
.ms-d{font-size:11px;color:var(--foam);margin-top:2px}
.ms-v{font-size:13px;margin-top:6px}
.ms-good{color:#7EE0A8;font-weight:600;margin-left:4px}
.ms-bad{color:#FFAA44;font-weight:600;margin-left:4px}
.rp-lang{margin-left:auto;margin-right:10px}
.sum-warn{margin-top:8px;font-size:12px;color:#FFD27A}
body.report-mode #app,body.report-mode #ob{display:none!important}
.tr-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.tr-l{width:96px;flex-shrink:0;font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-bar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.tr-bar span{display:block;height:100%;background:#FFAA44}
.tr-v{width:82px;flex-shrink:0;text-align:right;font-size:13px;font-weight:600;color:#FFAA44}
.tr-v small{display:block;font-size:10px;font-weight:400;color:rgba(255,255,255,.6)}
.tr-change{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;line-height:1.7}
.sum-acts{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.sum-act{padding:13px;border-radius:12px;border:1px solid rgba(170,221,238,.35);background:transparent;color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
.sum-act.main{background:var(--wave);border-color:var(--wave)}
.sum-axis{margin-top:22px;text-align:center;font-size:13px;color:#FFE3A8;line-height:1.6}
.sum-empty{margin-top:40px;text-align:center;font-size:13px;color:rgba(255,255,255,.7);line-height:1.8}
.guide-step{display:flex;gap:14px;align-items:flex-start;margin:16px 0}
.guide-n{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(95,211,230,.2);border:1px solid #5FD3E6;font-weight:600}
.guide-t{font-size:15px;font-weight:500;line-height:1.5}
.guide-d{font-size:12px;color:var(--foam);line-height:1.6;margin-top:2px}
.guide-warn{margin-top:18px;padding:10px 12px;border-radius:12px;background:rgba(255,119,102,.08);border:1px solid rgba(255,119,102,.35);font-size:12px;line-height:1.6;color:rgba(255,255,255,.85)}
.sheet-ok{display:block;width:100%;margin-top:22px;padding:14px;border:none;border-radius:var(--r);background:var(--wave);color:#fff;font-family:inherit;font-size:15px;cursor:pointer}

/* 活動 */
#act-chip{position:absolute;left:12px;top:calc(var(--hdr-h,96px) + 6px);z-index:26;display:none;align-items:center;gap:8px;
  max-width:calc(100% - 190px);padding:6px 12px 6px 10px;border-radius:16px;border:1px solid rgba(255,210,122,.6);
  background:rgba(6,22,36,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-family:inherit;font-size:11px;cursor:pointer}
#act-chip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-dot{width:8px;height:8px;border-radius:50%;background:#FFD27A;flex-shrink:0;animation:acpulse 2s infinite}
@keyframes acpulse{0%,100%{opacity:1}50%{opacity:.35}}
#app.in-act #act-chip{display:flex}
#app.in-act #spec-tip{display:none}
.act-card{padding:14px;border-radius:14px;background:rgba(255,210,122,.07);border:1px solid rgba(255,210,122,.4);margin-bottom:12px}
.act-card.plain{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.12)}
.act-name{font-size:16px;font-weight:500;line-height:1.4}
.act-sub{font-size:12px;color:var(--foam);margin-top:3px;line-height:1.5}
.act-code{font-family:'Inter',monospace;font-size:28px;letter-spacing:.18em;font-weight:600;color:#FFE3A8;margin:8px 0 2px}
.act-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.act-btn{padding:9px 14px;border-radius:12px;border:1px solid rgba(170,221,238,.35);background:transparent;color:#fff;font-family:inherit;font-size:13px;cursor:pointer}
.act-btn.main{background:var(--wave);border-color:var(--wave)}
.act-btn.warn{color:#FFB4A8;border-color:rgba(255,119,102,.4)}
.act-in{display:flex;gap:8px}
.act-in input,.act-form input,.act-form select{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:15px;outline:none}
.act-in input{text-transform:uppercase;letter-spacing:.15em;font-family:'Inter',monospace}
.act-form{display:flex;flex-direction:column;gap:8px}
.act-form label{font-size:11px;color:var(--foam);margin-top:4px}
.act-form select option{color:#000}
.act-qr{display:flex;justify-content:center;margin:12px 0 4px}
.act-qr img,.act-qr canvas{background:#fff;padding:8px;border-radius:10px;width:180px;height:180px;image-rendering:pixelated}
.act-err{font-size:12px;color:#FF9A8A;margin-top:6px;min-height:1em}
.act-list .act-card{margin-bottom:8px}
.sum-scope{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);margin-bottom:6px}
.sum-scope .k{font-size:11px;color:var(--foam)}
.sum-scope .n{font-size:17px;font-weight:500;margin-top:2px;line-height:1.4}
.sum-scope .m{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:rgba(255,255,255,.75);margin-top:6px}
#sumv.scoped .sum-filter{display:none}

/* 地図操作ツール（右側） */
.map-tools{
  display:flex;flex-direction:column;margin:8px 10px 0 0!important;
  border-radius:22px;overflow:hidden;
  background:rgba(6,22,36,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(170,221,238,.25);box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.map-tool{
  width:44px;height:44px;border:none;background:transparent;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
}
.map-tool svg{width:20px;height:20px}
.map-tool:hover{background:rgba(255,255,255,.08)}
.map-tool:active{background:rgba(255,255,255,.18)}
.map-tool-sep{height:1px;background:rgba(255,255,255,.12);margin:0 8px}
/* 地図はピンチ操作をアプリ側で扱う（ブラウザ全体の拡大を防ぐ） */
#leafmap{touch-action:none}

/* 地図のクレジット（右上） */
.leaflet-top.leaflet-right .leaflet-control-attribution{
  margin:10px 10px 0 0;padding:2px 8px;border-radius:10px;
  background:rgba(255,255,255,.75);font-size:10px;line-height:1.6;
}
.leaflet-tile{filter:brightness(.85) saturate(.7)}

/* HEADER */
#hdr{position:relative;z-index:35;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,16px) 20px 12px;background:linear-gradient(180deg,rgba(4,17,28,.95) 0%,transparent 100%)}
#logo{font-size:22px;font-weight:300;letter-spacing:.15em;color:var(--foam);display:flex;align-items:center}
/* 壁紙 */
/* 上部の帯（ヘッダー＋凡例）に写真を敷く。表示位置で写真のどの帯を見せるか選べる */
#wp-layer{position:absolute;left:0;right:0;top:0;height:var(--hdr-h,96px);z-index:0;display:none;background-size:cover;background-repeat:no-repeat}
#app.has-wp #wp-layer{display:block}
#app.has-wp{background-size:cover;background-repeat:no-repeat;background-position:center}
#app.has-wp #hdr{background:linear-gradient(180deg,rgba(4,17,28,.7) 0%,rgba(4,17,28,.25) 100%)}
#app.has-wp #leg{background:linear-gradient(180deg,rgba(4,17,28,.25),rgba(4,17,28,.1))}
#sum-btn{
  margin-left:8px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(170,221,238,.25);
  background:rgba(4,17,28,.35);color:var(--foam);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
#sum-btn svg{width:15px;height:15px}
.wp-sep{height:1px;background:rgba(255,255,255,.1);margin:4px 8px}
#wp-btn{
  margin-left:6px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(170,221,238,.25);
  background:rgba(4,17,28,.35);color:var(--foam);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
}
#wp-btn svg{width:15px;height:15px}
#wp-btn:active{transform:scale(.92)}
#wp-menu{
  position:absolute;left:16px;top:calc(env(safe-area-inset-top,16px) + 44px);z-index:60;display:none;
  width:240px;padding:8px;border-radius:16px;
  background:rgba(6,22,36,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(170,221,238,.25);box-shadow:0 10px 30px rgba(0,0,0,.4);
}
#wp-menu.show{display:block}
.wp-item{display:block;width:100%;text-align:left;padding:11px 12px;border:none;border-radius:10px;background:transparent;color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
.wp-item:active{background:rgba(255,255,255,.1)}
.wp-reset{color:#FFB4A8}
.wp-pos{display:flex;align-items:center;gap:6px;padding:6px 12px 8px;font-size:12px;color:var(--foam)}
.wp-pos span{margin-right:auto}
.wp-pos button{padding:5px 10px;border-radius:12px;border:1px solid rgba(170,221,238,.3);background:transparent;color:#fff;font-family:inherit;font-size:12px;cursor:pointer}
.wp-pos button.on{background:rgba(95,211,230,.25);border-color:#5FD3E6}
.wp-off .wp-pos,.wp-off .wp-reset{display:none}
.wp-note{font-size:11px;line-height:1.5;color:rgba(170,221,238,.7);padding:6px 12px 4px;border-top:1px solid rgba(255,255,255,.08);margin-top:4px}
#hdr-counts{display:flex;gap:14px}
#hdr-right{display:flex;align-items:center;gap:12px}
.lang-seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(170,221,238,.3);background:rgba(4,17,28,.35)}
.lang-seg button{padding:4px 7px;border:none;background:transparent;color:rgba(255,255,255,.6);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:.06em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lang-seg button.on{background:rgba(95,211,230,.28);color:#fff}
#ob-lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:2}
#cnt-lbl{max-width:56px}
#hdr-counts{cursor:pointer}
.hc{text-align:right}
.hc-n{font-size:20px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.hc-l{font-size:10px;letter-spacing:.06em;color:var(--a);font-weight:600}
#cnt-lbl{font-size:11px;letter-spacing:.04em;color:var(--foam);opacity:.75;margin-left:10px}

/* LEGEND */
#leg{position:relative;z-index:20;display:flex;flex-wrap:nowrap;gap:5px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none}
#leg::-webkit-scrollbar{display:none}
.li{
  display:flex;align-items:center;gap:5px;padding:5px 9px 5px 8px;border-radius:14px;flex-shrink:0;
  background:rgba(4,17,28,.6);border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font-family:inherit;font-size:11px;letter-spacing:.02em;color:rgba(255,255,255,.88);
  cursor:pointer;transition:opacity .15s,background .15s;-webkit-tap-highlight-color:transparent;
}
.li:active{transform:scale(.96)}
.ld{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.li-n{font-weight:600;color:var(--c);min-width:10px;text-align:right}
.li.off{opacity:.45}
.li.off .ld{background:transparent;box-shadow:none;border:1.5px solid var(--c);width:5px;height:5px}
#cnt-lbl{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}

/* BOTTOM */
/* 下部は地図の上に重ねる（地図を画面いっぱいに） */
#btm{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 45px);background:none;pointer-events:none}
#cam-btn{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:rgba(26,122,154,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(170,221,238,.5);cursor:pointer;margin:0 auto;pointer-events:auto;animation:glow 3s infinite}
#cam-btn:active{transform:scale(.92)}
#cam-btn svg{width:28px;height:28px;fill:none;stroke:var(--white);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(26,122,154,.5)}70%{box-shadow:0 0 0 16px rgba(26,122,154,0)}100%{box-shadow:0 0 0 0 rgba(26,122,154,0)}}

/* CAMERA */
#camv{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100}
#camv.show{display:flex}
#campre{flex:1;position:relative;overflow:hidden}
#camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camfrm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#camfrm-in{width:72%;aspect-ratio:1;border:1.5px solid rgba(255,255,255,.4);border-radius:12px;position:relative}
#camfrm-in::before{content:'';position:absolute;top:-1px;left:-1px;width:20px;height:20px;border-top:2px solid var(--white);border-left:2px solid var(--white);border-radius:3px 0 0 0}
#camfrm-in::after{content:'';position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;border-bottom:2px solid var(--white);border-right:2px solid var(--white);border-radius:0 0 3px 0}
#shtbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px env(safe-area-inset-bottom,20px);background:rgba(4,17,28,.95)}
#backbtn{width:44px;height:44px;background:none;border:1.5px solid rgba(255,255,255,.3);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#backbtn svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:2;stroke-linecap:round}
#shutter{width:68px;height:68px;border-radius:50%;background:var(--white);border:none;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
#shutter:active{transform:scale(.88)}
#gallbtn{width:44px;height:44px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#gallbtn svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:1.8}

/* CONFIRM */
#confv{position:fixed;inset:0;background:var(--deep);display:none;flex-direction:column;z-index:200}
#confv.show{display:flex}
#confimg{flex:1;position:relative;overflow:hidden}
#confpre{width:100%;height:100%;object-fit:cover}
#jover{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(0deg,rgba(4,17,28,.98) 0%,transparent 100%)}
#jbadge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(34,204,238,.15);border:1px solid rgba(34,204,238,.4);margin-bottom:10px}
#jtxt{font-size:12px;color:var(--sea);letter-spacing:.04em}
#jitems{font-size:12px;color:var(--foam);line-height:1.7;opacity:.9;max-height:120px;overflow-y:auto}
#confbtns{padding:16px 24px env(safe-area-inset-bottom,20px);background:var(--deep);display:flex;gap:12px}
#btn-retry{flex:1;padding:14px;background:none;border:1.5px solid rgba(255,255,255,.2);border-radius:var(--r);color:var(--foam);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
#btn-send{flex:2;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:14px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}

/* LOADING */
#ldg{position:fixed;inset:0;background:rgba(4,17,28,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:500}
#ldg.show{display:flex}
.spin{width:40px;height:40px;border:2px solid rgba(26,122,154,.3);border-top-color:var(--wave);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ldgtxt{font-size:13px;color:var(--foam);opacity:.7;letter-spacing:.06em}

/* DONE */
#donev{position:fixed;inset:0;background:var(--deep);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300}
#donev.show{display:flex}
#done-rip{width:120px;height:120px;border-radius:50%;background:rgba(26,122,154,.15);border:1px solid rgba(26,122,154,.4);display:flex;align-items:center;justify-content:center;margin-bottom:32px}
#done-rip svg{width:48px;height:48px;fill:none;stroke:var(--wave);stroke-width:1.5;stroke-linecap:round}
#done-num{font-size:48px;font-weight:300;line-height:1;margin-bottom:6px}
#done-lbl{font-size:12px;color:var(--foam);opacity:.6;letter-spacing:.08em;margin-bottom:36px}
#done-imp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 28px;background:rgba(26,122,154,.1);border:1px solid rgba(26,122,154,.25);border-radius:var(--r);width:82%;max-width:320px;margin-bottom:36px}
.imp-ln{font-size:12px;color:var(--foam);opacity:.8;text-align:center;line-height:1.5}
.imp-ln strong{color:var(--white);font-weight:500}
#btn-back{padding:14px 40px;background:none;border:1.5px solid rgba(255,255,255,.2);border-radius:var(--r);color:var(--foam);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}

/* POPUP */
.leaflet-popup-content-wrapper{
  background:rgba(6,18,32,.85)!important;
  backdrop-filter:blur(20px)!important;
  -webkit-backdrop-filter:blur(20px)!important;
  border:1px solid rgba(100,200,255,.15)!important;
  border-radius:16px!important;
  box-shadow:0 8px 32px rgba(0,0,0,.4)!important;
  color:var(--white)!important;
  padding:0!important;
  overflow:hidden!important;
  resize:none!important;
}
.leaflet-popup-content{
  margin:0!important;
  width:300px!important;
  overflow:hidden!important;
}
.umi-pop{
  overflow:hidden;
  width:300px;
}
.leaflet-popup-tip-container{display:none!important}
.leaflet-popup-close-button{
  color:rgba(255,255,255,.5)!important;
  font-size:18px!important;
  top:8px!important;right:10px!important;
  z-index:20;line-height:1!important;
}
.leaflet-popup-close-button:hover{color:var(--white)!important}

/* 写真：大きめ表示、タップで全画面 */
.umi-pop-photo{position:relative;cursor:zoom-in;background:#04111C}
.umi-pop-photo img{
  width:100%;
  height:200px !important;
  object-fit:contain; /* 縦長・横長どちらの写真も切らずに全体を表示 */
  display:block;
}
.umi-pop-zoom{
  position:absolute;right:8px;bottom:8px;
  padding:4px 10px;border-radius:20px;
  background:rgba(4,17,28,.7);color:rgba(255,255,255,.85);
  font-size:10px;letter-spacing:.04em;pointer-events:none;
}

/* 全画面ビューア */
#photo-viewer{
  position:fixed;inset:0;z-index:9999;display:none;
  background:rgba(2,10,18,.96);
}
#photo-viewer.show{display:block}
#pv-scroll{
  position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
#pv-img{
  max-width:100vw;max-height:100vh;object-fit:contain;display:block;
  cursor:zoom-in;transition:none;touch-action:manipulation;
}
#photo-viewer.zoomed #pv-scroll{display:block}
#photo-viewer.zoomed #pv-img{max-width:none;max-height:none;width:250vw;cursor:zoom-out}
#pv-close{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:2;
  width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  background:rgba(4,17,28,.7);color:#fff;font-size:22px;line-height:38px;text-align:center;cursor:pointer;
}
#pv-hint{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:2;
  text-align:center;font-size:12px;color:rgba(255,255,255,.55);pointer-events:none;
}

/* 本文 - スクロールなし・固定 */
.umi-pop-body{
  padding:14px 16px 16px;
  /* 画面に収まらないときは本文だけスクロール */
  max-height:min(330px, calc(100vh - 520px));
  min-height:160px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  /* スクロールバーを隠す（スクロールはできる） */
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.umi-pop-body::-webkit-scrollbar{display:none}
/* 続きがあるときは下端をふわっと消して「まだ下がある」と分かるように */
.umi-pop-body.has-more{
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);
}

/* ヘッダー */
.umi-pop-hdr{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.umi-pop-badge{padding:3px 10px;border-radius:20px;font-size:11px;letter-spacing:.06em;font-weight:600;background:rgba(255,255,255,.1)}
.umi-pop-loc{font-size:13px;color:rgba(255,255,255,.8);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:150px}
.umi-pop-date{font-size:12px;color:rgba(255,255,255,.6);margin-left:auto}

/* 区切り */
.umi-pop-div{height:1px;background:rgba(255,255,255,.1);margin:10px 0}

/* 見出しラベル（共通） */
.umi-pop-label{font-size:11px;color:rgba(170,221,238,.75);letter-spacing:.04em;margin-bottom:4px}

/* ごみの一覧 */
.umi-pop-items{font-size:14px;color:rgba(255,255,255,.95);line-height:1.6;margin-bottom:12px}
/* 何が・何個・どこから */
.cnt-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px;color:#fff;margin-bottom:6px}
.cnt-sum b{font-weight:600;font-size:14px}
.cnt-parts{font-size:12px}
.cnt-list{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.cnt-row{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.92)}
.cnt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cnt-name{flex:1;min-width:0}
.cnt-n{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.75)}
.cnt-os{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.75);margin-left:4px}
.cnt-more{font-size:11px;color:rgba(255,255,255,.55)}

/* AIのコメント */
.umi-pop-comment{font-size:13px;color:rgba(255,255,255,.88);line-height:1.7;padding:8px 12px;border-left:3px solid rgba(95,211,230,.7);background:rgba(255,255,255,.04);border-radius:0 8px 8px 0;margin-bottom:12px}

/* 数値 */
.umi-pop-nums{display:flex;gap:6px;margin-bottom:10px}
.umi-pop-num{flex:1;padding:8px 8px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.umi-pop-num-label{font-size:11px;color:rgba(255,255,255,.65);margin-bottom:3px}
.umi-pop-num-val{font-size:15px;font-weight:500;color:#fff}

/* 改善に取り組める主体・排出経路 */
.umi-pop-stakeholder{padding:8px 12px;border-radius:8px;background:rgba(26,122,154,.18);border:1px solid rgba(26,122,154,.35);margin-bottom:8px}
.umi-pop-stakeholder-val{font-size:13px;color:#fff;line-height:1.5}
.umi-pop-route{font-size:13px;color:rgba(255,255,255,.9);line-height:1.5}

#camcanvas{display:none}
#filein{display:none}

/* ── 確認画面サマリー ── */
#conf-summary{
  padding:12px 14px;
  background:rgba(4,17,28,.95);
  overflow-y:auto;
  max-height:50vh;
  scrollbar-width:none;
}
#conf-summary::-webkit-scrollbar{display:none}
.cs-row{
  display:flex;align-items:flex-start;
  padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  gap:10px;
}
.cs-row:last-child{border-bottom:none}
.cs-label{
  font-size:10px;color:rgba(170,221,238,.5);
  letter-spacing:.06em;min-width:72px;flex-shrink:0;
  padding-top:2px;
}
.cs-val{font-size:12px;color:rgba(255,255,255,.88);line-height:1.5;flex:1}
.cs-edit{
  font-size:10px;color:rgba(26,122,154,.8);
  cursor:pointer;padding:2px 8px;
  border-radius:6px;border:1px solid rgba(26,122,154,.3);
  background:rgba(26,122,154,.1);flex-shrink:0;
  white-space:nowrap;
}
.cs-edit:hover{background:rgba(26,122,154,.25)}
.cs-warn{color:#FFAA44}
.cs-cat-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cs-cat-btn{
  padding:3px 10px;border-radius:12px;font-size:11px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);
  cursor:pointer;
}
.cs-cat-btn.active{border-color:var(--c);background:rgba(var(--cr),var(--cg),var(--cb),.2);color:var(--white);}

/* ── ナビゲーション（自分／みんなの記録を順に見る） ── */
.nav-pair{
  position:fixed;z-index:30;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  width:54px;display:flex;flex-direction:column;align-items:stretch;
  border-radius:28px;overflow:hidden;
  background:rgba(6,22,36,.82);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(170,221,238,.22);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  touch-action:none;user-select:none;-webkit-user-select:none;
  transition:border-color .2s,box-shadow .2s,opacity .2s;
}
#nav-mine{left:16px;--accent:#5FD3E6}
#nav-digest{right:16px;--accent:#FFD27A}
.nav-pair.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(0,0,0,.35)}
.nav-pair.empty{opacity:.45}
.nav-btn{
  height:42px;border:none;background:transparent;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .12s;
}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:rgba(255,255,255,.08)}
.nav-btn:active{background:rgba(255,255,255,.16)}
.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.nav-mid{
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;
  border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);
}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.nav-count{font-size:12px;color:#fff;font-variant-numeric:tabular-nums;line-height:1.2;text-align:center}
.nav-count .tot{color:rgba(255,255,255,.55);font-size:10px}
.nav-count.bump{animation:navbump .25s}
@keyframes navbump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

.umi-pin{
  width:12px;height:12px;border-radius:50%;
  background:var(--c);
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 0 0 3px rgba(255,255,255,.2);
  transition:transform .15s ease,box-shadow .15s ease;
  cursor:pointer;
}
.leaflet-marker-icon:hover .umi-pin{
  transform:scale(1.6);
  box-shadow:0 0 0 5px rgba(255,255,255,.3);
}
</style>
</head>
<body>
<div id="photo-viewer" onclick="if(event.target===this||event.target.id==='pv-scroll')closePhoto()">
  <div id="pv-scroll"><img id="pv-img" src="" alt="記録写真（拡大）" data-i18n-alt="photo.altZoom" onclick="togglePhotoZoom(event)"></div>
  <button id="pv-close" onclick="closePhoto()" aria-label="閉じる" data-i18n-aria="close">&times;</button>
  <div id="pv-hint" data-i18n="photo.hint">写真をタップで拡大・縮小</div>
</div>

<!-- ONBOARDING -->
<div id="ob">
  <div id="ob-lang"><div class="lang-seg" role="group" aria-label="Language / 言語"><button type="button" data-lang="ja" onclick="setLang('ja')">JA</button><button type="button" data-lang="en" onclick="setLang('en')">EN</button></div></div>
  <div id="ob-logo">umi</div>

  <!-- アプリの大事な仕様（中身は SPECS から自動で作る） -->
  <div id="ob-specs" style="width:100%;max-width:320px;margin-bottom:20px"></div>

  <!-- ログイン・新規画面 -->
  <div id="ob-auth" style="width:100%;max-width:320px">
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--foam);opacity:.6;letter-spacing:.06em;margin-bottom:6px" data-i18n="auth.nick">ニックネーム</div>
      <input id="inp-nick" type="text" placeholder="例: umi" data-i18n-ph="auth.nickPh" maxlength="20"
        style="width:100%;padding:12px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:14px;font-family:'Inter',sans-serif;outline:none">
    </div>
    <div style="margin-bottom:20px">
      <div style="font-size:11px;color:var(--foam);opacity:.6;letter-spacing:.06em;margin-bottom:6px" data-i18n="auth.pin">PIN（数字6桁）</div>
      <input id="inp-pin" type="password" placeholder="000000" maxlength="8" inputmode="numeric"
        style="width:100%;padding:12px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:18px;letter-spacing:.3em;font-family:'Inter',sans-serif;outline:none">
      <div style="font-size:11px;color:#fff;opacity:.9;margin-top:6px;text-shadow:0 1px 3px rgba(4,30,50,.6)" data-i18n="auth.pinNote">PINは暗号化して保存します。忘れると再発行できません</div>
    </div>
    <button id="ob-auth-btn" onclick="doAuth()" style="width:100%;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:15px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:12px">はじめる</button>
    <div id="ob-auth-err" style="font-size:12px;color:#FF7766;text-align:center;margin-bottom:10px;display:none"></div>
    <div id="ob-sub-link" style="text-align:center;font-size:11px;color:rgba(255,255,255,.3)">はじめて？ <a href="#" onclick="switchTab('new');return false;" style="color:rgba(170,221,238,.5)">新規登録</a></div>
  </div>
</div>

<!-- APP -->
<!-- 集計画面 -->
<div id="sumv" class="sheet" role="dialog" aria-modal="true">
  <div class="sheet-hdr"><div class="sheet-title" data-i18n="sum.title">集計</div><button class="sheet-x" onclick="closeSummary()" aria-label="閉じる" data-i18n-aria="close">&times;</button></div>

  <div class="seg-row sum-filter"><span class="seg-lbl" data-i18n="sum.period">期間</span>

  <div class="seg-row sum-filter"><span class="seg-lbl" data-i18n="sum.area">場所</span>
    <div class="seg" id="sum-area"><button data-v="view" onclick="setSum('area','view')" data-i18n="sum.view">地図の表示範囲</button><button data-v="all" onclick="setSum('area','all')" data-i18n="sum.everywhere">すべて</button></div></div>
  <div id="sum-body"></div>
</div>
<!-- 活動（団体・参加・主催） -->
<div id="actv" class="sheet" role="dialog" aria-modal="true">
  <div class="sheet-hdr"><div class="sheet-title" data-i18n="act.title">活動</div><button class="sheet-x" onclick="closeActivity()" aria-label="閉じる" data-i18n-aria="close">&times;</button></div>
  <div id="act-body"></div>
</div>
<!-- 撮り方の案内 -->
<div id="guidev" class="sheet" role="dialog" aria-modal="true">
  <div class="sheet-hdr"><div class="sheet-title" data-i18n="guide.title">撮り方</div><button class="sheet-x" onclick="closeGuide()" aria-label="閉じる" data-i18n-aria="close">&times;</button></div>
  <div id="guide-body"></div>
  <button class="sheet-ok" onclick="closeGuide()" data-i18n="guide.ok">わかった</button>
</div>

<div id="app">
  <div id="wp-layer" aria-hidden="true"></div>
  <div id="hdr">

function t(k,vars){
  let s=(I18N[LANG]&&I18N[LANG][k])??I18N.ja[k]??k;
  if(vars) for(const v in vars) s=s.split('{'+v+'}').join(vars[v]);

// 画面の固定文言を書き換える（data-i18n＝文字、-ph＝入力欄の例、-aria＝読み上げ名と説明）
function applyI18nStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n);});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{e.placeholder=t(e.dataset.i18nPh);});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>{const v=t(e.dataset.i18nAria);e.setAttribute('aria-label',v);if(e.hasAttribute('title'))e.title=v;});
  document.querySelectorAll('[data-i18n-alt]').forEach(e=>{e.alt=t(e.dataset.i18nAlt);});
  document.querySelectorAll('[data-i18n-nav]').forEach(e=>{const [g,d]=e.dataset.i18nNav.split('|');e.setAttribute('aria-label',t(g)+'：'+t(d));});
  document.querySelectorAll('.lang-seg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
}

  const waitL = setInterval(async ()=>{
    if(typeof L !== 'undefined'){
      clearInterval(waitL);

      // セッション復元を試みる
      const restored = await restoreSession();

      // バックグラウンドでプリロード
      document.getElementById('app').style.visibility='hidden';
      document.getElementById('app').classList.add('show');
      loadRecords().then(()=>{
        document.getElementById('app').classList.remove('show');
        document.getElementById('app').style.visibility='';
        preloaded = true;

        // セッション復元済みならそのままメイン画面へ
        if(restored) startApp();
      });
    }
  }, 50);
});

function getCookie(name){
  const m=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  return m?decodeURIComponent(m[2]):null;
}
function setCookie(name,val,days=365){
  const d=new Date();d.setTime(d.getTime()+days*864e5);
  document.cookie=name+'='+encodeURIComponent(val)+';expires='+d.toUTCString()+';path=/;SameSite=Lax';
}

function switchTab(mode){

  if(btn) btn.textContent=mode==='new'?t('auth.register'):t('auth.start');

async function doAuth(){
  const nick=document.getElementById('inp-nick').value.trim();
  const pin=document.getElementById('inp-pin').value.trim();
  const errEl=document.getElementById('ob-auth-err');
  errEl.style.display='none';
  const pinClean=pin.replace(/\D/g,''); // 数字以外を除去
  if(!nick){errEl.textContent=t('auth.needNick');errEl.style.display='block';return;}
  // 新規登録は6桁。ログインは、以前の4桁の人も入れるよう4〜8桁を受け付ける
  if(authMode==='new'?pinClean.length!==6:(pinClean.length<4||pinClean.length>8)){errEl.textContent=t(authMode==='new'?'auth.pin6':'auth.pinLen');errEl.style.display='block';return;}
  document.getElementById('ob-auth-btn').textContent=t('auth.checking');
  try{
    const res=await api(authMode==='new'?'register':'login',{nickname:nick,pin:pinClean});
    if(res.error){
      const mins=(String(res.error).match(/(\d+)分後/)||[])[1];
      errEl.textContent=mins?t('auth.locked',{m:mins}):tv(res.error);errEl.style.display='block';
      document.getElementById('ob-auth-btn').textContent=authMode==='new'?t('auth.register'):t('auth.start');return;
    }
    currentUserId=res.user.id;currentNickname=res.user.nickname;
    saveSession(res.token,currentNickname);
    needReload=true; // ログイン前に読み込んだ地図（全件ぼかし）を、自分の記録つきで読み直す
    startApp();
    if(res.short_pin) setTimeout(()=>toast(t('pin.suggest')),1500); // 4桁の人には6桁への変更を勧める
  }catch(e){
    errEl.textContent=t('auth.error');
    errEl.style.display='block';
    document.getElementById('ob-auth-btn').textContent=authMode==='new'?t('auth.register'):t('auth.start');
    console.error(e);
  }
}

}

// 日付を端末の現地時刻で YYYY-MM-DD にする（朝の撮影が前日表示になるのを防ぐ）
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d.getTime())) return String(iso).slice(0,10);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

const API_URL = SB_URL + '/functions/v1/umi-api';
async function api(action, payload={}){
  const r=await fetch(API_URL,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY},
    body:JSON.stringify({action,token:sessionToken,...payload})});
  const data=await r.json().catch(()=>({error:t('net.error')}));
  if(!r.ok&&!data.error) data.error=t('net.errorCode',{n:r.status});
  return data;
}

async function upload(blob){
  const b64=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.onerror=rej;rd.readAsDataURL(blob);});
  const r=await api('upload',{image_base64:b64});
  if(r.error||!r.url) throw new Error(r.error||'upload failed');
  return r.url;
}

function initMap(clat, clng, zoom){

  lmap = L.map('leafmap',{
    center:[clat,clng],zoom:zoom||13,minZoom:2,maxZoom:19,
    zoomControl:false,attributionControl:false,
    scrollWheelZoom:true,wheelPxPerZoomLevel:90, // PCはマウスホイールで拡大縮小
    zoomSnap:0.25,zoomDelta:1,                   // 指で細かく拡大縮小できるように
    inertia:true,inertiaDeceleration:2500,       // 指を離した後もなめらかに流れる
    bounceAtZoomLimits:false,
    tapTolerance:20,
    doubleClickZoom:false                        // ダブルタップ拡大は自前の処理で行う
  });
  // OpenStreetMapのクレジットは右上に表示（その下に操作ツール）
  L.control.attribution({position:'topright'}).addTo(lmap);
  addMapTools();
  enableOneFingerZoom(lmap);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:19,
    maxNativeZoom:19
  }).addTo(lmap);
  lmap.on('popupopen',e=>{
    const el=e.popup.getElement()&&e.popup.getElement().querySelector('.umi-pop-body');
    if(el){updatePopFade(el);setTimeout(()=>updatePopFade(el),300);} // 写真の読み込み後にも再判定

}

function onWallpaperFile(input){
  const f=input.files&&input.files[0];
  input.value='';
  if(!f) return;
  const rd=new FileReader();
  rd.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      // 端末に保存できるよう縮小（長い辺1600px）。写り込んだ位置情報などはこの変換で消える
      const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let q=.82,url=c.toDataURL('image/jpeg',q);
      while(url.length>1500000&&q>.4){q-=.12;url=c.toDataURL('image/jpeg',q);} // 約1MB以内に
      try{
        localStorage.setItem(WP_KEY,url);
      }catch(e){
        alert(t('wp.saveFail'));return;
      }
      applyWallpaper();
      document.getElementById('wp-menu').classList.remove('show');
    };
    img.onerror=()=>alert(t('wp.loadFail'));
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
}

function summaryRecords(){
  const recs=window.allRecords||[];
  if(typeof sumScope!=='undefined'&&sumScope){ const set=new Set(sumScope.ids); return recs.filter(r=>r.activity_id&&set.has(r.activity_id)); }

  if(sumPeriod==='today'){const d=new Date();d.setHours(0,0,0,0);start=d.getTime();}

// 個数と由来を足し合わせる（AIの集計がある記録だけ）
function aggregate(recs){
  const z=()=>({total:0,land:0,sea:0,unknown:0});
  const a={...z(),overseas:0,weight:0,weightKnown:false,estimated:false,photos:0,noCount:0,items:{},seaSide:z(),landSide:z()};
  recs.forEach(r=>{
    const c=countsOf(r);
    if(!c){a.noCount++;return;}
    a.photos++;
    const side=normCat(r.category)==='SEA'?a.seaSide:a.landSide;
    (c.item_counts||[]).forEach(x=>{
      const n=Number(x.count)||0;
      const k=x.origin==='陸由来'?'land':x.origin==='海上由来'?'sea':'unknown';
      a.total+=n;a[k]+=n;side.total+=n;side[k]+=n;
      if(x.overseas) a.overseas+=n;
      if(x.estimated) a.estimated=true;
      if(x.weight_g_each!=null){a.weight+=n*x.weight_g_each;a.weightKnown=true;}
      const name=canonName(x.name);
      if(name){a.items[name]=a.items[name]||{n:0,origin:x.origin,en:''};a.items[name].n+=n;if(!a.items[name].en&&x.name_en)a.items[name].en=x.name_en;}
    });
  });
  return a;
}

const NAME_SYNONYMS=[
  [/キャップ|ふた|蓋/,'ペットボトルのキャップ'],[/ペット\s*ボトル|PET\s*ボトル|ＰＥＴ/i,'PETボトル'],

  [/瓶|ビン|びん/,'ガラス瓶'],[/ボトル/,'PETボトル'],[/レジ袋|ビニール袋|ポリ袋/,'レジ袋'],[/包装|パッケージ|菓子袋|袋/,'食品の包装・袋'],
  [/発泡/,'発泡スチロール片'],[/漁網|網/,'漁網'],[/ロープ|ひも|紐/,'ロープ・ひも'],[/ブイ|浮き|フロート/,'ブイ・浮き'],
  [/釣り?糸|テグス/,'釣り糸'],[/ルアー|釣り?具|釣り?針/,'釣り具・ルアー'],[/ストロー/,'ストロー'],[/カップ/,'プラスチックカップ'],
  [/トレー|弁当|容器/,'食品容器・トレー'],[/ライター/,'ライター'],[/花火/,'花火'],[/風船/,'風船'],[/マスク/,'マスク'],
  [/フィルム/,'フィルム片'],[/破片|かけら|欠片/,'プラスチック破片']
];
function canonName(n){
  const s=String(n||'').trim();
  // 外国語表記などの補足は外して、種類でそろえる（例：ハングル表記のPETボトル → PETボトル）
  for(const [re,name] of NAME_SYNONYMS) if(re.test(s)) return name;
  return s;
}

// ── 答え合わせ用に書き出す（AIの判定の横に、人の判定を書き込む表） ──
function csvCell(v){ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCheckCsv(){
  const recs=summaryRecords().filter(r=>countsOf(r));
  if(!recs.length){alert(t('sum.empty').replace('<br>','\n'));return;}
  const head=[t('ck.date'),t('ck.cat'),t('ck.place'),t('ck.photo'),t('ck.id'),t('ck.item'),t('ck.aiCount'),t('ck.aiOrigin'),t('ck.humanCount'),t('ck.humanOrigin'),t('ck.match'),t('ck.diff')];
  const rows=[head];
  recs.forEach(r=>{
    (countsOf(r).item_counts||[]).forEach(x=>{
      const n=rows.length+1; // Excelの行番号
      rows.push([fmtDate(r.photo_taken_at||r.created_at),normCat(r.category),r.location_name||'',r.image_url||'',r.id,canonName(x.name),x.count,x.origin,'','',
        `=IF(J${n}="","",IF(J${n}=H${n},1,0))`,`=IF(I${n}="","",I${n}-G${n})`]);
    });
  });
  const last=rows.length;
  rows.push([]);
  rows.push([t('ck.rate'),'','','','','','','','','',`=IFERROR(AVERAGE(K2:K${last}),"")`,'']);
  rows.push([t('ck.checked'),'','','','','','','','','',`=COUNT(K2:K${last})`,'']);
  rows.push([t('ck.how')]);
  rows.push([t('ck.origins')]);
  const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  saveBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'umi_check_'+stamp+'.csv');
}
// ファイルを保存（スマホは共有シート、PCはダウンロード）
async function saveBlob(blob,name){
  try{
    const f=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return;}
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

async function shareSummaryImage(){
  const recs=summaryRecords().filter(r=>countsOf(r)), a=aggregate(recs);
  if(!a.total){alert(t('sum.empty').replace('<br>','\n'));return;}
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  const FONT='"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
  const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#0A2233');grad.addColorStop(1,'#04111C');
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  const text=(s,x,y,size,color,weight,align)=>{g.font=(weight||400)+' '+size+'px '+FONT;g.fillStyle=color;g.textAlign=align||'left';g.fillText(s,x,y);};
  const L=pct(a.land,a.total),S=pct(a.sea,a.total),U=Math.max(0,100-L-S);
  text('umi',90,140,44,'#5FD3E6',300);
  const place=summaryPlaceLabel(recs),period=summaryPeriodLabel(recs);
  if(sumScope){
    const m=scopeMeta(recs);
    text(m.when||period,W-90,140,30,'rgba(255,255,255,.7)',400,'right');
    text(m.title,90,200,34,'#fff',500);
    text([m.sub,m.people!=null?t('act.people',{n:m.people}):''].filter(Boolean).join('　'),90,240,26,'rgba(255,255,255,.65)',400);
  } else {
    text([place,period].filter(Boolean).join('　'),W-90,140,30,'rgba(255,255,255,.7)',400,'right');
  }
  const oy=sumScope?70:0; // 活動の見出しがあるときは、本体を下げる
  text(t('sum.q'),90,280+oy,40,'rgba(255,255,255,.85)',400);
  text(t('sum.atLeast'),90,420+oy,46,'rgba(255,255,255,.9)',500);
  g.font='600 220px '+FONT;const preW=(()=>{g.font='500 46px '+FONT;return g.measureText(t('sum.atLeast')).width;})();
  text(String(L),90+preW+24,470+oy,220,'#FFAA44',600);
  g.font='600 220px '+FONT;const numW=g.measureText(String(L)).width;
  text('%',90+preW+24+numW+12,470+oy,80,'#FFAA44',500);
  text(t('sum.heroSub',{total:a.total,photos:a.photos}),90,560+oy,34,'rgba(255,255,255,.75)',400);
  // 帯グラフ
  const bx=90,by=610+oy,bw=W-180,bh=34;let x=bx;
  [[L,'#FFAA44'],[S,'#22CCEE'],[U,'rgba(255,255,255,.28)']].forEach(([p,col])=>{const w=bw*p/100;g.fillStyle=col;g.fillRect(x,by,w,bh);x+=w;});
  const leg=[[t('origin.陸由来')+' '+a.land,'#FFAA44'],[t('origin.海上由来')+' '+a.sea,'#22CCEE'],[t('origin.判別できない')+' '+a.unknown,'rgba(255,255,255,.5)']];
  let lx=bx;leg.forEach(([s_,col])=>{g.fillStyle=col;g.beginPath();g.arc(lx+10,by+bh+48,10,0,7);g.fill();text(s_,lx+30,by+bh+60,30,'rgba(255,255,255,.8)');g.font='400 30px '+FONT;lx+=g.measureText(s_).width+80;});
  // 多かったごみ
  text(t('sum.top'),90,820+oy,30,'rgba(170,221,238,.9)',500);
  const top=Object.entries(a.items).sort((p,q)=>q[1].n-p[1].n).slice(0,4);
  top.forEach(([name,v],i)=>{const y=880+oy+i*62;g.fillStyle=ORIGIN_COL[v.origin]||'rgba(255,255,255,.5)';g.beginPath();g.arc(100,y-12,10,0,7);g.fill();
    text(itemLabel(name,v.en),128,y,36,'#fff');text('×'+v.n,W-90,y,36,'rgba(255,255,255,.75)',400,'right');});
  // 軸
  g.fillStyle='rgba(255,210,122,.35)';g.fillRect(90,1180,W-180,2);
  text(t('axis.t'),W/2,1250,40,'#FFE3A8',500,'center');
  text(t('sum.imgNote'),W/2,1305,22,'rgba(255,255,255,.45)',400,'center');
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));
  const d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  await saveBlob(blob,'umi_summary_'+stamp+'.png');
  return c; // テスト用
}


// ── 活動（団体・参加・主催）。個人での利用は、活動に参加しなくても今までどおり ──
const ACT_KEY='umi_activity';
function currentActivity(){
  try{const a=JSON.parse(localStorage.getItem(ACT_KEY)||'null');if(a&&a.until>Date.now())return a;}catch(e){}
  return null;
}
function setCurrentActivity(a){
  try{ if(a) localStorage.setItem(ACT_KEY,JSON.stringify(a)); else localStorage.removeItem(ACT_KEY); }catch(e){}
  updateActChip();
}
function updateActChip(){
  const a=currentActivity(),app=document.getElementById('app');
  if(app) app.classList.toggle('in-act',!!a);
  const el=document.getElementById('act-chip-t');
  if(el&&a) el.textContent=t('act.joining')+'：'+a.name;
}
// コードで参加（参加者は団体に入らなくてよい。開始から24時間は参加中のまま）
async function joinActivity(code,silent){
  const res=await api('activity_join',{code});
  if(res.error){ if(!silent) alert(tv(res.error)); return false; }
  const a=res.activity, start=new Date(a.starts_at||Date.now()).getTime();
  setCurrentActivity({id:a.id,name:a.name,code:a.join_code,place:a.place_name||'',org:a.org_name||'',until:Math.max(start,Date.now())+24*3600e3});
  return true;
}
function leaveActivity(){ setCurrentActivity(null); renderActivity(); }
// QRコードやリンクで開いたとき（?join=コード）は、ログイン後に自動で参加
function pendingJoinFromUrl(){
  try{
    const u=new URL(location.href),c=u.searchParams.get('join');
    if(c){sessionStorage.setItem('umi_join',c);u.searchParams.delete('join');history.replaceState(null,'',u.pathname+u.search+u.hash);}
  }catch(e){}
}
pendingJoinFromUrl();
async function consumePendingJoin(){
  let c=null;try{c=sessionStorage.getItem('umi_join');sessionStorage.removeItem('umi_join');}catch(e){}
  if(c&&await joinActivity(c,true)){ const a=currentActivity(); if(a) toast(t('act.joined',{name:a.name})); }
}
function joinUrl(code){ return location.origin+location.pathname+'?join='+encodeURIComponent(code); }
function qrHtml(text){
  try{ const q=qrcode(0,'M'); q.addData(text); q.make(); return q.createImgTag(6,0); }catch(e){ return ''; }
}
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);transform:translateX(-50%);z-index:6000;padding:10px 16px;border-radius:14px;background:rgba(6,22,36,.92);border:1px solid rgba(255,210,122,.5);color:#fff;font-size:13px;max-width:86%;text-align:center;transition:opacity .4s';document.body.appendChild(el);}
  el.textContent=msg;el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';},3200);
}

async function joinByInput(){
  const v=document.getElementById('act-code').value, err=document.getElementById('act-err');
  err.textContent='';
  const res=await api('activity_join',{code:v});
  if(res.error){err.textContent=tv(res.error);return;}
  await joinActivity(v,true); toast(t('act.joined',{name:res.activity.name})); renderActivity();
}
async function createActivity(){
  const name=document.getElementById('af-name').value.trim(), place=document.getElementById('af-place').value.trim(), org=document.getElementById('af-org').value;
  const res=await api('activity_create',{name,place_name:place,org_id:org||null});
  if(res.error){document.getElementById('af-err').textContent=tv(res.error);return;}
  actCreated=res.activity; actShowForm=false;
  await joinActivity(res.activity.join_code,true); // 作った人も参加中に
  await refreshMine();
}
function showCode(id){ actCreated=(actMine.activities||[]).find(a=>a.id===id)||null; actShowForm=false; renderActivity(); document.getElementById('actv').scrollTop=0; }
async function finishActivity(id){
  const a=(actMine.activities||[]).find(x=>x.id===id); if(!a) return;
  let v=prompt(t('act.askPeople'),a.participants!=null?a.participants:'');
  while(v!==null&&!/^\s*[1-9]\d{0,4}\s*$/.test(v)) v=prompt(t('act.askPeopleAgain'),'');
  if(v===null) return;
  const res=await api('activity_update',{id,participants:Number(v),ends_at:a.ends_at||new Date().toISOString()});
  if(res.error){alert(tv(res.error));return;}
  await refreshMine();
}
// PINの変更（今のPIN → 新しい6桁 → 確認）
async function changePin(){
  const cur=prompt(t('pin.askCur')); if(cur===null) return;
  let next=prompt(t('pin.askNew'));
  while(next!==null&&!/^\d{6}$/.test(next.trim())) next=prompt(t('pin.askNewAgain'));
  if(next===null) return;
  const again=prompt(t('pin.askConfirm')); if(again===null) return;
  if(again.trim()!==next.trim()){alert(t('pin.mismatch'));return;}
  const r=await api('change_pin',{current:cur.trim(),next:next.trim()});
  if(r.error){const mins=(String(r.error).match(/(\d+)分後/)||[])[1];alert(mins?t('auth.locked',{m:mins}):tv(r.error));return;}
  toast(t('pin.changed'));
}

// ── 活動・団体のレポート（集計画面を、その活動の記録だけに絞って開く） ──
let sumScope=null;
async function loadScope(type,id){
  if(type==='org'){
    const r=await api('org_info',{id}); if(r.error) return null;
    return {type,id,ids:r.activities.map(a=>a.id),acts:r.activities,measures:r.measures||[],orgName:r.org.name};
  }
  const r=await api('activity_info',{ids:[id]}); if(r.error||!r.activities.length) return null;
  return {type,id,ids:[id],acts:r.activities,measures:[],orgName:r.activities[0].org_name||''};
}
async function openReport(type,id){
  const sc=await loadScope(type,id);
  if(!sc){alert(t('rp.notFound'));return;}
  sumScope=sc;
  closeActivity();
  openSummary();
  translateMissing();
}

function reportUrl(){ return location.origin+location.pathname+'?report='+(sumScope.type==='org'?'o':'a')+'.'+sumScope.id+'&lang='+LANG; }

// リンクから開いたとき：ログイン画面を出さずに、レポートだけを表示
let reportMode=false;

  let p=null; try{p=new URL(location.href).searchParams.get('report');}catch(e){}
  if(!p||!/^[ao]\.[0-9a-zA-Z-]{1,64}$/.test(p)) return false;
  reportMode=true;
  // 送った人と同じ言語で開く（受け取った人の端末の設定は変えない）

  applyI18nStatic();
  document.getElementById('ob').style.display='none';
  document.body.classList.add('report-mode');
  const [type,id]=[p[0]==='o'?'org':'activity',p.slice(2)];

  sumScope=sc;
  openSummary();
  return true;
}


// ── 変化を見る（同じ場所・同じ団体で、陸由来がどう変わったか） ──
// 量は拾った人数や時間で変わるので、比べるのは「陸由来の割合」と、人数が分かるときの「1人あたりの陸由来の個数」
function trendGroups(recs){
  const groups=new Map();
  const byAct=!!(sumScope&&sumScope.type==='org');
  recs.forEach(r=>{
    const c=countsOf(r); if(!c) return;
    let key,label,date,people=null;
    if(byAct){
      const a=(sumScope.acts||[]).find(x=>x.id===r.activity_id); if(!a) return;
      key=a.id; label=a.name; date=a.starts_at; people=a.participants;
    } else {
      const d=new Date(r.photo_taken_at||r.created_at); if(isNaN(d)) return;
      key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); label=LANG==='en'?key:(d.getFullYear()+'年'+(d.getMonth()+1)+'月'); date=key+'-01';
    }
    if(!groups.has(key)) groups.set(key,{key,label,date,people,total:0,land:0});
    const g=groups.get(key);
    (c.item_counts||[]).forEach(x=>{const n=Number(x.count)||0;g.total+=n;if(x.origin==='陸由来')g.land+=n;});
  });
  return [...groups.values()].filter(g=>g.total>0).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function trendHtml(recs){
  const gs=trendGroups(recs);
  if(gs.length<2) return '';
  const usePeople=gs.every(g=>g.people);
  const ms=(sumScope&&sumScope.measures)||[];
  const shown=gs.slice(-8);
  const rows=shown.map((g,i)=>{
    const prev=i?shown[i-1]:null;
    const marks=ms.filter(m=>String(m.started_on)<=String(g.date).slice(0,10)&&(!prev||String(m.started_on)>String(prev.date).slice(0,10)));
    return marks.map(m=>'<div class="tr-mark">'+t('ms.mark',{t:esc(m.title)})+'</div>').join('')+trRow(g);
  }).join('');
  function trRow(g){
    const p=pct(g.land,g.total), per=usePeople?(g.land/g.people):null;
    return '<div class="tr-row"><div class="tr-l">'+esc(g.label)+'</div><div class="tr-bar"><span style="width:'+p+'%"></span></div>'+
      '<div class="tr-v">'+p+'%<small>'+(per!=null?t('tr.perPerson',{n:per.toFixed(1)}):t('cnt.total',{n:g.total}))+'</small></div></div>';
  }
  const f=gs[0], l=gs[gs.length-1], d=pct(l.land,l.total)-pct(f.land,f.total);
  let change=t('tr.share',{a:pct(f.land,f.total),b:pct(l.land,l.total),d:(d>0?'+':'')+d});
  if(usePeople){ const a=f.land/f.people,b=l.land/l.people; change+='<br>'+t('tr.per',{a:a.toFixed(1),b:b.toFixed(1),r:a?Math.round((b-a)/a*100):0}); }
  return '<div class="sum-sec"><div class="sum-h">'+t(sumScope&&sumScope.type==='org'?'tr.titleAct':'tr.titleMonth')+'</div>'+rows+
    '<div class="tr-change">'+change+'</div><div class="sum-note" style="margin-top:6px">'+t(usePeople?'tr.notePeople':'tr.noteNoPeople')+'</div></div>';
}


// ── 取り組みの前後で、陸由来がどう変わったか ──
// 比べるのは「1人あたりの陸由来の個数」（人数が分からない回があるときは割合）
function measuresHtml(recs){
  if(!sumScope||sumScope.type!=='org'||!(sumScope.measures||[]).length) return '';
  const gs=trendGroups(recs);
  const usePeople=gs.length&&gs.every(g=>g.people);
  const val=list=>{
    if(!list.length) return null;
    const land=list.reduce((n,g)=>n+g.land,0), total=list.reduce((n,g)=>n+g.total,0), people=list.reduce((n,g)=>n+(g.people||0),0);
    return usePeople?(people?land/people:null):(total?land/total*100:null);
  };
  const fmt=v=>usePeople?t('ms.perPerson',{n:v.toFixed(1)}):Math.round(v)+'%';
  const rows=sumScope.measures.map(m=>{
    const d=String(m.started_on);
    const before=gs.filter(g=>String(g.date).slice(0,10)<d), after=gs.filter(g=>String(g.date).slice(0,10)>=d);
    const b=val(before), a=val(after);
    let res;
    if(b==null) res=t('ms.noBefore');
    else if(a==null) res=t('ms.noAfter');
    else { const r=b?Math.round((a-b)/b*100):0; res=fmt(b)+' → '+fmt(a)+'<b class="'+(r<0?'ms-good':'ms-bad')+'">（'+(r>0?'+':'')+r+'%）</b>'; }
    return '<div class="ms-row"><div class="ms-t">'+esc(m.title)+'</div><div class="ms-d">'+t('ms.since',{d:esc(d)})+(m.note?' ・ '+esc(m.note):'')+'</div><div class="ms-v">'+t('ms.beforeAfter')+'：'+res+'</div></div>';
  }).join('');
  return '<div class="sum-sec"><div class="sum-h">'+t('ms.title')+'</div>'+rows+'<div class="sum-note" style="margin-top:6px">'+t(usePeople?'ms.note':'ms.noteShare')+'</div></div>';
}

function exportIccCsv(){
  const recs=summaryRecords().filter(r=>countsOf(r));
  if(!recs.length){alert(t('sum.empty').replace('<br>','\n'));return;}
  const tally=new Map();
  recs.forEach(r=>(countsOf(r).item_counts||[]).forEach(x=>{
    const [en,ja]=iccItem(x), k=en;
    if(!tally.has(k)) tally.set(k,{en,ja,n:0,names:new Set()});
    const g=tally.get(k); g.n+=Number(x.count)||0; g.names.add(canonName(x.name));
  }));
  const m=sumScope?scopeMeta(recs):null;
  const people=m&&m.people!=null?m.people:'';
  const rows=[

    [t('icc.people'),people],
    [t('icc.photos'),recs.length],

  ];
  [...tally.values()].sort((a,b)=>b.n-a.n).forEach(g=>rows.push([g.en,g.ja,g.n,[...g.names].join(' / ')]));

// ── 片手で拡大縮小：ダブルタップしてそのまま上下になぞる（Googleマップと同じ操作） ──
function enableOneFingerZoom(map){
  const el=map.getContainer();
  let lastTap=0,lastX=0,lastY=0,active=false,startY=0,startZoom=0,anchor=null,moved=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){active=false;return;}
    const t=e.touches[0],now=Date.now();
    const near=Math.hypot(t.clientX-lastX,t.clientY-lastY)<40;
    if(now-lastTap<300&&near){
      // 2回目のタップ：地図のドラッグを止めて、上下の動きで拡大縮小する
      active=true;moved=false;startY=t.clientY;startZoom=map.getZoom();
      const r=el.getBoundingClientRect();
      anchor=map.containerPointToLatLng([t.clientX-r.left,t.clientY-r.top]);
      map.dragging.disable();
      e.preventDefault();
    }
    lastTap=now;lastX=t.clientX;lastY=t.clientY;
  },{capture:true,passive:false});
  el.addEventListener('touchmove',e=>{
    if(!active) return;
    const dy=e.touches[0].clientY-startY;
    if(Math.abs(dy)>8) moved=true;
    if(!moved) return;
    e.preventDefault();e.stopPropagation();
    // 下へなぞると拡大、上へなぞると縮小（150pxで1段階）
    const z=Math.max(map.getMinZoom(),Math.min(map.getMaxZoom(),startZoom+dy/150));
    map.setZoomAround(anchor,z,{animate:false});
  },{capture:true,passive:false});
  let gestureAt=0;
  const end=e=>{
    if(!active) return;
    active=false;
    map.dragging.enable();
    e.preventDefault(); // この後に来るクリック・ダブルクリックを起こさない
    gestureAt=Date.now();
    lastTap=0;          // 次のタップは新しい1回目として数える
    if(!moved){
      // なぞらずに離した＝ふつうのダブルタップ：タップした場所を中心に拡大
      map.setZoomAround(anchor,Math.min(map.getMaxZoom(),Math.round(startZoom)+1));
    }
  };
  el.addEventListener('touchend',end,{capture:true,passive:false});
  el.addEventListener('touchcancel',end,{capture:true,passive:false});
  // PCのダブルクリック：クリックした場所を中心に拡大（Shiftを押しながらで縮小）
  map.on('dblclick',e=>{
    if(Date.now()-gestureAt<600) return; // タッチ操作の直後に届いたものは無視
    const d=e.originalEvent&&e.originalEvent.shiftKey?-1:1;
    map.setZoomAround(e.containerPoint,Math.round(map.getZoom())+d);
  });
}

// ── AIが書いた文章の英語表示 ──
// 標準のごみの名前は辞書で、コメントやメーカー名はAIが書いた英語版で。英語版がない過去の文章は、まとめて翻訳して端末に覚える
const ITEM_EN={'PETボトル':'PET bottle','ペットボトルのキャップ':'Bottle cap','飲料缶':'Beverage can','ガラス瓶':'Glass bottle','食品の包装・袋':'Food wrapper / bag',
  'レジ袋':'Plastic shopping bag','プラスチックカップ':'Plastic cup','ストロー':'Straw','食品容器・トレー':'Food container / tray','たばこの吸い殻':'Cigarette butt',
  'ライター':'Lighter','花火':'Fireworks','風船':'Balloon','おもちゃ':'Toy','衣類・布':'Clothing / fabric','靴・サンダル':'Shoe / sandal','マスク':'Face mask',
  '衛生用品':'Hygiene product','紙くず':'Paper scrap','漁網':'Fishing net','ロープ・ひも':'Rope / string','ブイ・浮き':'Buoy / float','釣り糸':'Fishing line',
  '釣り具・ルアー':'Fishing gear / lure','養殖用資材':'Aquaculture material','プラスチック破片':'Plastic fragment','発泡スチロール片':'Foam fragment',
  'フィルム片':'Film fragment','ゴム片':'Rubber fragment','金属片':'Metal fragment','木材（加工品）':'Processed wood'};
const hasJa=v=>/[\u3040-\u30ff\u4e00-\u9fff]/.test(String(v||''));
let TR={}; try{TR=JSON.parse(localStorage.getItem('umi_tr')||'{}')||{};}catch(e){TR={};}
// 文章を表示言語に合わせる（ja：そのまま／en：英語版→翻訳済み→元の文）
function aiText(ja,en){
  if(LANG!=='en'||!ja) return ja||'';
  if(en) return en;
  return TR[ja]||ja;
}
// ごみの名前を表示言語に合わせる
function itemLabel(name,nameEn){
  if(LANG!=='en') return name;
  return ITEM_EN[canonName(name)]||ITEM_EN[name]||nameEn||TR[name]||name;
}
// 英語版のない日本語の文章を集めて、まとめて翻訳（ログインしている時だけ。1回の表示で最大150件）
let trRunning=false;
async function translateMissing(){
  if(LANG!=='en'||trRunning||!sessionToken) return;
  const need=new Set();
  (window.allRecords||[]).forEach(r=>{
    const aj=r.analysis_json||{};
    if(hasJa(aj.summary)&&!aj.summary_en&&!TR[aj.summary]) need.add(aj.summary);
    if(hasJa(r.manufacturer)&&!(aj.manufacturer_en)&&!TR[r.manufacturer]&&shown(r.manufacturer)) need.add(r.manufacturer);
    if(hasJa(r.location_name)&&!TR[r.location_name]) need.add(r.location_name);
    (aj.item_counts||[]).forEach(x=>{ if(hasJa(x.name)&&!x.name_en&&!ITEM_EN[canonName(x.name)]&&!TR[x.name]) need.add(x.name); });
  });
  if(typeof sumScope!=='undefined'&&sumScope){
    [sumScope.orgName,...(sumScope.acts||[]).flatMap(a=>[a.name,a.place_name,a.org_name])].forEach(v=>{ if(hasJa(v)&&!TR[v]) need.add(v); });
  }
  const list=[...need].slice(0,150); if(!list.length) return;
  trRunning=true;
  try{
    for(let i=0;i<list.length;i+=50){
      const part=list.slice(i,i+50);
      const r=await fetch(EDGE_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY},body:JSON.stringify({mode:'translate',texts:part,token:sessionToken})});
      if(!r.ok) break;
      const d=await r.json();
      (d.translations||[]).forEach((tx,j)=>{ if(tx&&tx!==part[j]) TR[part[j]]=tx; });
    }
    // 覚えすぎないよう、新しい順に600件まで
    const keys=Object.keys(TR); if(keys.length>600) keys.slice(0,keys.length-600).forEach(k=>delete TR[k]);
    try{localStorage.setItem('umi_tr',JSON.stringify(TR));}catch(e){}
    if(LANG==='en'){
      if(typeof refreshMapTexts==='function') refreshMapTexts();
      if(document.getElementById('sumv').classList.contains('show')) renderSummary();
    }
  }catch(e){} finally{ trRunning=false; }
}

let mineIdx=0, digestIdx=0;
let mineStarted=false, digestStarted=false;
let mineRecs=[], digestRecs=[];

function buildNavRecs(){
  if(!window.allRecords) return;
  mineRecs = window.allRecords
    .filter(r=>r.is_mine&&r.lat&&r.lng)
    .sort((a,b)=>new Date(a.photo_taken_at||a.created_at)-new Date(b.photo_taken_at||b.created_at));
  digestRecs = window.allRecords
    .filter(r=>!r.is_mine&&r.lat&&r.lng)
    .sort((a,b)=>{
      const sc={高:3,中:2,低:1};
      const d=(sc[b.mp_risk]||0)-(sc[a.mp_risk]||0);
      return d!==0?d:new Date(b.created_at)-new Date(a.created_at);
    });
  mineRecs=mineRecs.filter(r=>!hiddenCats.has(normCat(r.category)));
  digestRecs=digestRecs.filter(r=>!hiddenCats.has(normCat(r.category)));
  mineIdx=0; digestIdx=0; mineStarted=false; digestStarted=false;
  document.querySelectorAll('.nav-pair').forEach(e=>e.classList.remove('active'));
  updateNavInfo('mine');
  updateNavInfo('digest');
}

function updateNavInfo(type){
  const recs=type==='mine'?mineRecs:digestRecs;
  const idx=type==='mine'?mineIdx:digestIdx;
  const el=document.getElementById('nav-'+type+'-info');
  if(!el) return;
  const started=type==='mine'?mineStarted:digestStarted;
  const pairEl=document.getElementById('nav-'+type);
  if(pairEl) pairEl.classList.toggle('empty',recs.length===0);
  if(!started||recs.length===0){ el.innerHTML='<span class="tot">'+t('count',{n:recs.length})+'</span>'; return; }
  el.innerHTML=(idx+1)+'<span class="tot">/'+recs.length+'</span>';
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

function goTo(type, idx){
  const recs=type==='mine'?mineRecs:digestRecs;
  if(!recs||recs.length===0){
 return; }
  // 初めて押したときは、↓なら1件目、↑なら最後の記録へ
  const started=type==='mine'?mineStarted:digestStarted;
  if(!started) idx=idx>0?0:recs.length-1;
  idx=((idx%recs.length)+recs.length)%recs.length;
  if(type==='mine'){mineIdx=idx;mineStarted=true;}
  else{digestIdx=idx;digestStarted=true;}
  document.querySelectorAll('.nav-pair').forEach(e=>e.classList.toggle('active',e.id==='nav-'+type));
  if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){}
  updateNavInfo(type);
  const r=recs[idx];
  if(!lmap||!r.lat||!r.lng) return;

  lmap.closePopup();

  const bounds=lmap.getBounds();
  const inView=bounds.contains(L.latLng(r.lat,r.lng));

  if(inView){
    setTimeout(()=>openMarkerPopup(r), 100);
  } else {
    lmap.flyTo([r.lat,r.lng],15,{animate:true,duration:0.6});
    setTimeout(()=>openMarkerPopup(r), 700);
  }
}

function openMarkerPopup(r){
  const marker = r.id ? markerMap[r.id] : null;
  if(!marker){
 return; }

  // フォーカスアニメーション
  const el = marker.getElement();
  if(el){
    const pin = el.querySelector('.umi-pin');
    if(pin){
      pin.style.transition='transform .2s,box-shadow .2s';
      pin.style.transform='scale(2.5)';
      pin.style.boxShadow='0 0 0 10px rgba(255,255,255,.25)';
      setTimeout(()=>{pin.style.transform='';pin.style.boxShadow='';}, 700);
    }
  }
  marker.openPopup();
}

function initNav(){
  // ボタンイベント
  const mu=document.getElementById('mine-up');
  const md=document.getElementById('mine-dn');
  const du=document.getElementById('digest-up');
  const dd=document.getElementById('digest-dn');
  if(window._navInit) return; window._navInit=true; // 二重登録を防ぐ
  // タップで1件、押しっぱなしで連続して送る
  const hold=(btn,type,dir)=>{
    if(!btn) return;
    let t=null,iv=null;
    const step=()=>goTo(type,(type==='mine'?mineIdx:digestIdx)+dir);
    const stop=()=>{clearTimeout(t);clearInterval(iv);t=iv=null;};
    btn.addEventListener('pointerdown',e=>{e.preventDefault();step();t=setTimeout(()=>{iv=setInterval(step,450);},500);});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
    btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();step();}});
  };
  hold(mu,'mine',-1); hold(md,'mine',1); hold(du,'digest',-1); hold(dd,'digest',1);

  // ホバースクロール
  ['nav-mine','nav-digest'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    const type=id==='nav-mine'?'mine':'digest';
    let last=0;
    el.addEventListener('wheel',(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const now=Date.now();
      if(now-last<400) return;
      last=now;
      goTo(type,(type==='mine'?mineIdx:digestIdx)+(e.deltaY>0?1:-1));
    },{passive:false,capture:true});
    // 中央（ラベル部分）を上下にスワイプしても送れる
    const mid=el.querySelector('.nav-mid')||el;
    let ty=0;
    mid.addEventListener('touchstart',(e)=>{ty=e.touches[0].clientY;},{passive:true});
    mid.addEventListener('touchend',(e)=>{
      const d=ty-e.changedTouches[0].clientY;
      if(Math.abs(d)>30) goTo(type,(type==='mine'?mineIdx:digestIdx)+(d>0?1:-1));
    },{passive:true});
  });
}

// ── 写真の情報（位置・撮影日）を読む。読めない理由も返す ──
// issue: null=問題なし / 'heic'=HEIC形式 / 'notimage'=画像でない / 'noexif'=写真情報なし / 'nogps'=位置情報なし / 'zero'=位置が0,0
let photoIssue=null;
function readPhotoMeta(file){
  return new Promise(resolve=>{
    const done=(o)=>resolve(Object.assign({gps:null,date:null,issue:null},o));
    const name=(file.name||'').toLowerCase(), type=(file.type||'').toLowerCase();
    if(type.includes('heic')||type.includes('heif')||/\.(heic|heif)$/.test(name)) return done({issue:'heic'});
    if(type&&!type.startsWith('image/')) return done({issue:'notimage'});
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const buf=e.target.result, view=new DataView(buf);
        if(view.byteLength<4||view.getUint16(0)!==0xFFD8){
          // JPEG以外（PNGのスクリーンショットなど）。HEICの中身かどうかも確認
          const head=String.fromCharCode(...new Uint8Array(buf.slice(4,12)));
          return done({issue:/ftyp(heic|heix|mif1|msf1|hevc)/.test(head)?'heic':'noexif'});
        }
        // JPEGの中の情報ブロックを順に見て、Exif（写真情報）を探す。XMPなど別のブロックは飛ばす
        let off=2, gps=null, date=null, exif=false;
        while(off<view.byteLength-4){
          const mk=view.getUint16(off), sz=view.getUint16(off+2);
          if(mk===0xFFDA||mk===0xFFD9) break;            // 画像本体に入ったら終わり
          if(mk===0xFFE1){
            const blk=buf.slice(off+4,off+2+sz);
            const h=new Uint8Array(blk.slice(0,4));
            if(String.fromCharCode(...h)==='Exif'){
              exif=true;
              gps=gps||parseGPS(blk);
              date=date||parseDateFromExif(blk);
            }
          }
          if(sz<2) break;
          off+=2+sz;
        }
        if(!exif) return done({issue:'noexif'});
        if(!gps) return done({date,issue:'nogps'});
        if(Math.abs(gps.lat)<0.0001&&Math.abs(gps.lng)<0.0001) return done({date,issue:'zero'});
        done({gps,date});
      }catch(err){done({issue:'noexif'});}
    };
    rd.onerror=()=>done({issue:'notimage'});
    rd.readAsArrayBuffer(file);
  });
}
function parseGPS(buf){
  try{
    const v=new DataView(buf),len=buf.byteLength;
    if(len<6) return null;
    const hdr=String.fromCharCode(v.getUint8(0),v.getUint8(1),v.getUint8(2),v.getUint8(3));
    if(hdr!=='Exif') return null;
    const t=6;
    const le=v.getUint16(t)===0x4949;
    const r16=o=>v.getUint16(t+o,le);
    const r32=o=>v.getUint32(t+o,le);
    const ifd=r32(4);
    if(t+ifd+2>len) return null;
    const n=r16(ifd);
    let go=-1;
    for(let i=0;i<n;i++){const b=ifd+2+i*12;if(t+b+12>len)break;if(r16(b)===0x8825){go=r32(b+8);break;}}
    if(go<0||t+go+2>len) return null;
    const gn=r16(go);
    let latR='N',lngR='E',lat=null,lng=null;
    const rat=o=>{if(o+8>len)return 0;const n=v.getUint32(o,le),d=v.getUint32(o+4,le);return d===0?0:n/d;};
    for(let i=0;i<gn;i++){
      const b=go+2+i*12;if(t+b+12>len)break;
      const tag=r16(b),vo=r32(b+8),ao=t+vo;
      if(tag===0x01&&ao<len) latR=String.fromCharCode(v.getUint8(ao));
      else if(tag===0x03&&ao<len) lngR=String.fromCharCode(v.getUint8(ao));
      else if((tag===0x02||tag===0x04)&&ao+24<=len){
        const deg=rat(ao)+rat(ao+8)/60+rat(ao+16)/3600;
        if(tag===0x02)lat=deg;else lng=deg;
      }
    }
    if(lat===null||lng===null) return null;
    return{lat:latR==='S'?-lat:lat,lng:lngR==='W'?-lng:lng};
  }catch(e){return null;}
}

// ── EXIF 撮影日 ──
function parseDateFromExif(buffer){
  try{
    const view=new DataView(buffer);
    const len=buffer.byteLength;
    if(len<6) return null;
    const hdr=String.fromCharCode(view.getUint8(0),view.getUint8(1),view.getUint8(2),view.getUint8(3));
    if(hdr!=='Exif') return null;
    const t=6;
    const le=view.getUint16(t)===0x4949;
    const r16=o=>view.getUint16(t+o,le);
    const r32=o=>view.getUint32(t+o,le);
    const ifd=r32(4);
    if(t+ifd+2>len) return null;
    // IFDの中からタグを探して文字列を読む
    const readTag=(dir,tagId)=>{
      if(t+dir+2>len) return null;
      const n=r16(dir);
      for(let i=0;i<n;i++){
        const b=dir+2+i*12;
        if(t+b+12>len) break;
        if(r16(b)===tagId) return b;
      }
      return null;
    };
    const readAscii=(b)=>{
      const vo=r32(b+8);let str='';
      for(let j=0;j<19&&t+vo+j<len;j++){const c=view.getUint8(t+vo+j);if(c===0)break;str+=String.fromCharCode(c);}
      return str;
    };
    // 撮影日時(0x9003)はExifの下の階層にある。なければ更新日時(0x0132)
    let str='';
    const exifPtr=readTag(ifd,0x8769);
    if(exifPtr!==null){const b=readTag(r32(exifPtr+8),0x9003);if(b!==null)str=readAscii(b);}
    if(!str){const b=readTag(ifd,0x0132);if(b!==null)str=readAscii(b);}
    const m=str.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
    if(m){
      // 撮影した端末の現地時刻として扱う（Safariでも読める形式）
      const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
      if(!isNaN(d.getTime())) return d.toISOString();
    }
    return null;
  }catch(e){return null;}
}

// ── 画像圧縮 ──
function resizeAndCompress(dataUrl, maxPx, quality){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>maxPx||h>maxPx){
        if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
        else{w=Math.round(w*maxPx/h);h=maxPx;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src=dataUrl;
  });
}

// AI解析用：長辺1920px・品質0.82（約500KB〜1MB）
async function compressForAnalysis(dataUrl){
  return resizeAndCompress(dataUrl, 1920, 0.82);
}

// ストレージ保存用：長辺800px・品質0.75（約100〜200KB）
async function compressForStorage(dataUrl){
  return resizeAndCompress(dataUrl, 800, 0.75);
}

async function analyze(){
  if(userLat==null||userLng==null){alert(t('an.'+(photoIssue==='noexif'?'noExif':photoIssue==='zero'?'zero':'noGps')));return;}
  showLoad(t('an.loading'));
  try{
    // 10MB制限対策：送信前に圧縮
    const compressed=await compressForAnalysis(capturedUrl);
    const b64=compressed.split(',')[1];
    const r=await fetch(EDGE_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY},body:JSON.stringify({imageBase64:b64,lat:userLat,lng:userLng,photoTakenAt:photoTakenAt,token:sessionToken})});
    if(r.status===401){hideLoad();alert(t('an.needLogin'));return;}
    if(r.status===413){hideLoad();alert(t('an.tooBig'));return;}
    if(!r.ok) throw new Error('AI解析失敗');
    analysisResult=await r.json();
    hideLoad();
    // ごみ判定
    if(analysisResult.is_trash === false){
      alert(t('an.noTrash'));
      return;
    }
    showConfirm();
  }catch(e){hideLoad();alert(t('an.fail'));console.error(e);}
}
