<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>umi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --deep:#04111C;--wave:#1A7A9A;--foam:#AADDEE;--white:#FFFFFF;
  --sea:#22CCEE;--river:#44BB88;--city:#FFAA44;--ground:#FF7766;
  --r:16px;
}
html,body{height:100%;background:var(--deep);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden}

/* ONBOARDING */
#ob{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 28px) 28px calc(env(safe-area-inset-bottom,0px) + 28px);z-index:1000;background:linear-gradient(180deg,#0A3A6A 0%,#1A6A9A 30%,#3A9AC0 60%,#8CCFE8 80%,#1A4A6A 100%)}
#ob-logo{font-size:32px;font-weight:300;letter-spacing:.2em;color:var(--foam);margin-bottom:20px;flex-shrink:0}
#ob>*{flex-shrink:0}
.ob-row{display:flex;align-items:flex-start;gap:14px;width:100%;max-width:320px;margin-bottom:16px}
.ob-ic{width:34px;height:34px;border-radius:50%;background:rgba(26,122,154,.25);border:1px solid rgba(170,221,238,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--foam)}
.ob-tx{font-size:12px;color:var(--foam);line-height:1.6}
.ob-h{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.6);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12)}
.ob-row+.ob-h{margin-top:6px}
.ob-cat{display:block;font-size:10px;letter-spacing:.08em;font-weight:600;line-height:1.4}
.ob-mini{display:flex;flex-direction:column;gap:8px}
.ob-mini-row{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.92)}
.ob-mini-ic{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--foam);background:rgba(26,122,154,.25);border:1px solid rgba(170,221,238,.3)}
.ob-tx strong{font-size:14px;font-weight:500}
.ob-tx strong{color:var(--white)}
#inp-nick:focus,#inp-pin:focus{border-color:rgba(26,122,154,.6)!important}
#ob-btn{width:100%;max-width:320px;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;font-family:'Inter',sans-serif}

/* MAP */
#app{position:fixed;inset:0;display:none;flex-direction:column;background:linear-gradient(180deg,#0A3A6A 0%,#1A6A9A 30%,#3A9AC0 60%,#8CCFE8 80%,#1A4A6A 100%)}
#app.show{display:flex}
#map{flex:1;position:relative;z-index:1}
.leaflet-container{z-index:1}
#leafmap{position:absolute;inset:0}
/* 仕様のさりげない案内（左上） */
#spec-tip{
  position:absolute;left:12px;top:calc(var(--hdr-h,96px) + 6px);z-index:25;
  max-width:calc(100% - 190px);min-width:0;
  display:flex;align-items:flex-start;gap:7px;text-align:left;
  padding:6px 11px 6px 8px;border-radius:16px;
  background:rgba(6,22,36,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(170,221,238,.18);color:#fff;font-family:inherit;cursor:pointer;
  transition:opacity .5s ease, max-width .3s ease;-webkit-tap-highlight-color:transparent;
}
#spec-tip.fade{opacity:0}
#spec-tip.open{z-index:40;background:rgba(6,22,36,.85)} /* 幅は変えずに折り返す（右上のクレジットに重ねない） */
.st-ic{flex-shrink:0;width:16px;height:16px;margin-top:1px;color:var(--foam)}
.st-ic svg{width:16px;height:16px}
.st-body{display:flex;flex-direction:column;min-width:0}
.st-t{font-size:11px;line-height:1.45;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-d{display:none;font-size:11px;line-height:1.5;color:var(--foam);margin-top:2px}
#spec-tip.open .st-t{white-space:normal}
#spec-tip.open .st-d{display:block}

/* 地図操作ツール（右側） */
.map-tools{
  display:flex;flex-direction:column;margin:8px 10px 0 0!important;
  border-radius:22px;overflow:hidden;
  background:rgba(6,22,36,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(170,221,238,.25);box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.map-tool{
  width:44px;height:44px;border:none;background:transparent;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
}
.map-tool svg{width:20px;height:20px}
.map-tool:hover{background:rgba(255,255,255,.08)}
.map-tool:active{background:rgba(255,255,255,.18)}
.map-tool-sep{height:1px;background:rgba(255,255,255,.12);margin:0 8px}
/* 地図はピンチ操作をアプリ側で扱う（ブラウザ全体の拡大を防ぐ） */
#leafmap{touch-action:none}

/* 地図のクレジット（右上） */
.leaflet-top.leaflet-right .leaflet-control-attribution{
  margin:10px 10px 0 0;padding:2px 8px;border-radius:10px;
  background:rgba(255,255,255,.75);font-size:10px;line-height:1.6;
}
.leaflet-tile{filter:brightness(.85) saturate(.7)}

/* HEADER */
#hdr{position:relative;z-index:35;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,16px) 20px 12px;background:linear-gradient(180deg,rgba(4,17,28,.95) 0%,transparent 100%)}
#logo{font-size:22px;font-weight:300;letter-spacing:.15em;color:var(--foam);display:flex;align-items:center}
/* 壁紙 */
/* 上部の帯（ヘッダー＋凡例）に写真を敷く。表示位置で写真のどの帯を見せるか選べる */
#wp-layer{position:absolute;left:0;right:0;top:0;height:var(--hdr-h,96px);z-index:0;display:none;background-size:cover;background-repeat:no-repeat}
#app.has-wp #wp-layer{display:block}
#app.has-wp{background-size:cover;background-repeat:no-repeat;background-position:center}
#app.has-wp #hdr{background:linear-gradient(180deg,rgba(4,17,28,.7) 0%,rgba(4,17,28,.25) 100%)}
#app.has-wp #leg{background:linear-gradient(180deg,rgba(4,17,28,.25),rgba(4,17,28,.1))}
#wp-btn{
  margin-left:8px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(170,221,238,.25);
  background:rgba(4,17,28,.35);color:var(--foam);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
}
#wp-btn svg{width:15px;height:15px}
#wp-btn:active{transform:scale(.92)}
#wp-menu{
  position:absolute;left:16px;top:calc(env(safe-area-inset-top,16px) + 44px);z-index:60;display:none;
  width:240px;padding:8px;border-radius:16px;
  background:rgba(6,22,36,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(170,221,238,.25);box-shadow:0 10px 30px rgba(0,0,0,.4);
}
#wp-menu.show{display:block}
.wp-item{display:block;width:100%;text-align:left;padding:11px 12px;border:none;border-radius:10px;background:transparent;color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
.wp-item:active{background:rgba(255,255,255,.1)}
.wp-reset{color:#FFB4A8}
.wp-pos{display:flex;align-items:center;gap:6px;padding:6px 12px 8px;font-size:12px;color:var(--foam)}
.wp-pos span{margin-right:auto}
.wp-pos button{padding:5px 10px;border-radius:12px;border:1px solid rgba(170,221,238,.3);background:transparent;color:#fff;font-family:inherit;font-size:12px;cursor:pointer}
.wp-pos button.on{background:rgba(95,211,230,.25);border-color:#5FD3E6}
.wp-off .wp-pos,.wp-off .wp-reset{display:none}
.wp-note{font-size:11px;line-height:1.5;color:rgba(170,221,238,.7);padding:6px 12px 4px;border-top:1px solid rgba(255,255,255,.08);margin-top:4px}
#hdr-counts{display:flex;gap:14px}
#hdr-right{display:flex;align-items:center;gap:12px}
.lang-seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(170,221,238,.3);background:rgba(4,17,28,.35)}
.lang-seg button{padding:4px 7px;border:none;background:transparent;color:rgba(255,255,255,.6);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:.06em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lang-seg button.on{background:rgba(95,211,230,.28);color:#fff}
#ob-lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:2}
#cnt-lbl{max-width:80px}
.hc{text-align:right}
.hc-n{font-size:20px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.hc-l{font-size:10px;letter-spacing:.06em;color:var(--a);font-weight:600}
#cnt-lbl{font-size:11px;letter-spacing:.04em;color:var(--foam);opacity:.75;margin-left:10px}

/* LEGEND */
#leg{position:relative;z-index:20;display:flex;flex-wrap:nowrap;gap:5px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none}
#leg::-webkit-scrollbar{display:none}
.li{
  display:flex;align-items:center;gap:5px;padding:5px 9px 5px 8px;border-radius:14px;flex-shrink:0;
  background:rgba(4,17,28,.6);border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font-family:inherit;font-size:11px;letter-spacing:.02em;color:rgba(255,255,255,.88);
  cursor:pointer;transition:opacity .15s,background .15s;-webkit-tap-highlight-color:transparent;
}
.li:active{transform:scale(.96)}
.ld{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.li-n{font-weight:600;color:var(--c);min-width:10px;text-align:right}
.li.off{opacity:.45}
.li.off .ld{background:transparent;box-shadow:none;border:1.5px solid var(--c);width:5px;height:5px}
#cnt-lbl{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}

/* BOTTOM */
/* 下部は地図の上に重ねる（地図を画面いっぱいに） */
#btm{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 45px);background:none;pointer-events:none}
#cam-btn{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:rgba(26,122,154,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(170,221,238,.5);cursor:pointer;margin:0 auto;pointer-events:auto;animation:glow 3s infinite}
#cam-btn:active{transform:scale(.92)}
#cam-btn svg{width:28px;height:28px;fill:none;stroke:var(--white);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(26,122,154,.5)}70%{box-shadow:0 0 0 16px rgba(26,122,154,0)}100%{box-shadow:0 0 0 0 rgba(26,122,154,0)}}

/* CAMERA */
#camv{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100}
#camv.show{display:flex}
#campre{flex:1;position:relative;overflow:hidden}
#camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camfrm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#camfrm-in{width:72%;aspect-ratio:1;border:1.5px solid rgba(255,255,255,.4);border-radius:12px;position:relative}
#camfrm-in::before{content:'';position:absolute;top:-1px;left:-1px;width:20px;height:20px;border-top:2px solid var(--white);border-left:2px solid var(--white);border-radius:3px 0 0 0}
#camfrm-in::after{content:'';position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;border-bottom:2px solid var(--white);border-right:2px solid var(--white);border-radius:0 0 3px 0}
#shtbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px env(safe-area-inset-bottom,20px);background:rgba(4,17,28,.95)}
#backbtn{width:44px;height:44px;background:none;border:1.5px solid rgba(255,255,255,.3);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#backbtn svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:2;stroke-linecap:round}
#shutter{width:68px;height:68px;border-radius:50%;background:var(--white);border:none;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
#shutter:active{transform:scale(.88)}
#gallbtn{width:44px;height:44px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#gallbtn svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:1.8}

/* CONFIRM */
#confv{position:fixed;inset:0;background:var(--deep);display:none;flex-direction:column;z-index:200}
#confv.show{display:flex}
#confimg{flex:1;position:relative;overflow:hidden}
#confpre{width:100%;height:100%;object-fit:cover}
#jover{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(0deg,rgba(4,17,28,.98) 0%,transparent 100%)}
#jbadge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(34,204,238,.15);border:1px solid rgba(34,204,238,.4);margin-bottom:10px}
#jtxt{font-size:12px;color:var(--sea);letter-spacing:.04em}
#jitems{font-size:12px;color:var(--foam);line-height:1.7;opacity:.9;max-height:120px;overflow-y:auto}
#confbtns{padding:16px 24px env(safe-area-inset-bottom,20px);background:var(--deep);display:flex;gap:12px}
#btn-retry{flex:1;padding:14px;background:none;border:1.5px solid rgba(255,255,255,.2);border-radius:var(--r);color:var(--foam);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
#btn-send{flex:2;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:14px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}

/* LOADING */
#ldg{position:fixed;inset:0;background:rgba(4,17,28,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:500}
#ldg.show{display:flex}
.spin{width:40px;height:40px;border:2px solid rgba(26,122,154,.3);border-top-color:var(--wave);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ldgtxt{font-size:13px;color:var(--foam);opacity:.7;letter-spacing:.06em}

/* DONE */
#donev{position:fixed;inset:0;background:var(--deep);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300}
#donev.show{display:flex}
#done-rip{width:120px;height:120px;border-radius:50%;background:rgba(26,122,154,.15);border:1px solid rgba(26,122,154,.4);display:flex;align-items:center;justify-content:center;margin-bottom:32px}
#done-rip svg{width:48px;height:48px;fill:none;stroke:var(--wave);stroke-width:1.5;stroke-linecap:round}
#done-num{font-size:48px;font-weight:300;line-height:1;margin-bottom:6px}
#done-lbl{font-size:12px;color:var(--foam);opacity:.6;letter-spacing:.08em;margin-bottom:36px}
#done-imp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 28px;background:rgba(26,122,154,.1);border:1px solid rgba(26,122,154,.25);border-radius:var(--r);width:82%;max-width:320px;margin-bottom:36px}
.imp-ln{font-size:12px;color:var(--foam);opacity:.8;text-align:center;line-height:1.5}
.imp-ln strong{color:var(--white);font-weight:500}
#btn-back{padding:14px 40px;background:none;border:1.5px solid rgba(255,255,255,.2);border-radius:var(--r);color:var(--foam);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}

/* POPUP */
.leaflet-popup-content-wrapper{
  background:rgba(6,18,32,.85)!important;
  backdrop-filter:blur(20px)!important;
  -webkit-backdrop-filter:blur(20px)!important;
  border:1px solid rgba(100,200,255,.15)!important;
  border-radius:16px!important;
  box-shadow:0 8px 32px rgba(0,0,0,.4)!important;
  color:var(--white)!important;
  padding:0!important;
  overflow:hidden!important;
  resize:none!important;
}
.leaflet-popup-content{
  margin:0!important;
  width:300px!important;
  overflow:hidden!important;
}
.umi-pop{
  overflow:hidden;
  width:300px;
}
.leaflet-popup-tip-container{display:none!important}
.leaflet-popup-close-button{
  color:rgba(255,255,255,.5)!important;
  font-size:18px!important;
  top:8px!important;right:10px!important;
  z-index:20;line-height:1!important;
}
.leaflet-popup-close-button:hover{color:var(--white)!important}

/* 写真：大きめ表示、タップで全画面 */
.umi-pop-photo{position:relative;cursor:zoom-in;background:#04111C}
.umi-pop-photo img{
  width:100%;
  height:200px !important;
  object-fit:contain; /* 縦長・横長どちらの写真も切らずに全体を表示 */
  display:block;
}
.umi-pop-zoom{
  position:absolute;right:8px;bottom:8px;
  padding:4px 10px;border-radius:20px;
  background:rgba(4,17,28,.7);color:rgba(255,255,255,.85);
  font-size:10px;letter-spacing:.04em;pointer-events:none;
}

/* 全画面ビューア */
#photo-viewer{
  position:fixed;inset:0;z-index:9999;display:none;
  background:rgba(2,10,18,.96);
}
#photo-viewer.show{display:block}
#pv-scroll{
  position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
#pv-img{
  max-width:100vw;max-height:100vh;object-fit:contain;display:block;
  cursor:zoom-in;transition:none;touch-action:manipulation;
}
#photo-viewer.zoomed #pv-scroll{display:block}
#photo-viewer.zoomed #pv-img{max-width:none;max-height:none;width:250vw;cursor:zoom-out}
#pv-close{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:2;
  width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  background:rgba(4,17,28,.7);color:#fff;font-size:22px;line-height:38px;text-align:center;cursor:pointer;
}
#pv-hint{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:2;
  text-align:center;font-size:12px;color:rgba(255,255,255,.55);pointer-events:none;
}

/* 本文 - スクロールなし・固定 */
.umi-pop-body{
  padding:14px 16px 16px;
  /* 画面に収まらないときは本文だけスクロール */
  max-height:min(330px, calc(100vh - 520px));
  min-height:160px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  /* スクロールバーを隠す（スクロールはできる） */
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.umi-pop-body::-webkit-scrollbar{display:none}
/* 続きがあるときは下端をふわっと消して「まだ下がある」と分かるように */
.umi-pop-body.has-more{
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);
}

/* ヘッダー */
.umi-pop-hdr{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.umi-pop-badge{padding:3px 10px;border-radius:20px;font-size:11px;letter-spacing:.06em;font-weight:600;background:rgba(255,255,255,.1)}
.umi-pop-loc{font-size:13px;color:rgba(255,255,255,.8);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:150px}
.umi-pop-date{font-size:12px;color:rgba(255,255,255,.6);margin-left:auto}

/* 区切り */
.umi-pop-div{height:1px;background:rgba(255,255,255,.1);margin:10px 0}

/* 見出しラベル（共通） */
.umi-pop-label{font-size:11px;color:rgba(170,221,238,.75);letter-spacing:.04em;margin-bottom:4px}

/* ごみの一覧 */
.umi-pop-items{font-size:14px;color:rgba(255,255,255,.95);line-height:1.6;margin-bottom:12px}

/* AIのコメント */
.umi-pop-comment{font-size:13px;color:rgba(255,255,255,.88);line-height:1.7;padding:8px 12px;border-left:3px solid rgba(95,211,230,.7);background:rgba(255,255,255,.04);border-radius:0 8px 8px 0;margin-bottom:12px}

/* 数値 */
.umi-pop-nums{display:flex;gap:6px;margin-bottom:10px}
.umi-pop-num{flex:1;padding:8px 8px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.umi-pop-num-label{font-size:11px;color:rgba(255,255,255,.65);margin-bottom:3px}
.umi-pop-num-val{font-size:15px;font-weight:500;color:#fff}

/* 改善に取り組める主体・排出経路 */
.umi-pop-stakeholder{padding:8px 12px;border-radius:8px;background:rgba(26,122,154,.18);border:1px solid rgba(26,122,154,.35);margin-bottom:8px}
.umi-pop-stakeholder-val{font-size:13px;color:#fff;line-height:1.5}
.umi-pop-route{font-size:13px;color:rgba(255,255,255,.9);line-height:1.5}

#camcanvas{display:none}
#filein{display:none}

/* ── 確認画面サマリー ── */
#conf-summary{
  padding:12px 14px;
  background:rgba(4,17,28,.95);
  overflow-y:auto;
  max-height:50vh;
  scrollbar-width:none;
}
#conf-summary::-webkit-scrollbar{display:none}
.cs-row{
  display:flex;align-items:flex-start;
  padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  gap:10px;
}
.cs-row:last-child{border-bottom:none}
.cs-label{
  font-size:10px;color:rgba(170,221,238,.5);
  letter-spacing:.06em;min-width:72px;flex-shrink:0;
  padding-top:2px;
}
.cs-val{font-size:12px;color:rgba(255,255,255,.88);line-height:1.5;flex:1}
.cs-edit{
  font-size:10px;color:rgba(26,122,154,.8);
  cursor:pointer;padding:2px 8px;
  border-radius:6px;border:1px solid rgba(26,122,154,.3);
  background:rgba(26,122,154,.1);flex-shrink:0;
  white-space:nowrap;
}
.cs-edit:hover{background:rgba(26,122,154,.25)}
.cs-warn{color:#FFAA44}
.cs-cat-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cs-cat-btn{
  padding:3px 10px;border-radius:12px;font-size:11px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);
  cursor:pointer;
}
.cs-cat-btn.active{border-color:var(--c);background:rgba(var(--cr),var(--cg),var(--cb),.2);color:var(--white);}

/* ── ナビゲーション（自分／みんなの記録を順に見る） ── */
.nav-pair{
  position:fixed;z-index:30;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  width:54px;display:flex;flex-direction:column;align-items:stretch;
  border-radius:28px;overflow:hidden;
  background:rgba(6,22,36,.82);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(170,221,238,.22);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  touch-action:none;user-select:none;-webkit-user-select:none;
  transition:border-color .2s,box-shadow .2s,opacity .2s;
}
#nav-mine{left:16px;--accent:#5FD3E6}
#nav-digest{right:16px;--accent:#FFD27A}
.nav-pair.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(0,0,0,.35)}
.nav-pair.empty{opacity:.45}
.nav-btn{
  height:42px;border:none;background:transparent;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .12s;
}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:rgba(255,255,255,.08)}
.nav-btn:active{background:rgba(255,255,255,.16)}
.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.nav-mid{
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;
  border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);
}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.nav-count{font-size:12px;color:#fff;font-variant-numeric:tabular-nums;line-height:1.2;text-align:center}
.nav-count .tot{color:rgba(255,255,255,.55);font-size:10px}
.nav-count.bump{animation:navbump .25s}
@keyframes navbump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

.umi-pin{
  width:12px;height:12px;border-radius:50%;
  background:var(--c);
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 0 0 3px rgba(255,255,255,.2);
  transition:transform .15s ease,box-shadow .15s ease;
  cursor:pointer;
}
.leaflet-marker-icon:hover .umi-pin{
  transform:scale(1.6);
  box-shadow:0 0 0 5px rgba(255,255,255,.3);
}
</style>

<div id="photo-viewer" onclick="if(event.target===this||event.target.id==='pv-scroll')closePhoto()">
  <div id="pv-scroll"><img id="pv-img" src="" alt="記録写真（拡大）" data-i18n-alt="photo.altZoom" onclick="togglePhotoZoom(event)"></div>
  <button id="pv-close" onclick="closePhoto()" aria-label="閉じる" data-i18n-aria="close">&times;</button>

</div>

<!-- ONBOARDING -->
<div id="ob">
  <div id="ob-lang"><div class="lang-seg" role="group" aria-label="Language / 言語"><button type="button" data-lang="ja" onclick="setLang('ja')">JA</button><button type="button" data-lang="en" onclick="setLang('en')">EN</button></div></div>
  <div id="ob-logo">umi</div>

  <!-- アプリの大事な仕様（中身は SPECS から自動で作る） -->
  <div id="ob-specs" style="width:100%;max-width:320px;margin-bottom:20px"></div>

  <!-- ログイン・新規画面 -->
  <div id="ob-auth" style="width:100%;max-width:320px">
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--foam);opacity:.6;letter-spacing:.06em;margin-bottom:6px" data-i18n="auth.nick">ニックネーム</div>
      <input id="inp-nick" type="text" placeholder="例: umi" data-i18n-ph="auth.nickPh" maxlength="20"
        style="width:100%;padding:12px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:14px;font-family:'Inter',sans-serif;outline:none">
    </div>
    <div style="margin-bottom:20px">
      <div style="font-size:11px;color:var(--foam);opacity:.6;letter-spacing:.06em;margin-bottom:6px" data-i18n="auth.pin">PIN（4桁）</div>
      <input id="inp-pin" type="password" placeholder="0000" maxlength="4" inputmode="numeric"
        style="width:100%;padding:12px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:18px;letter-spacing:.3em;font-family:'Inter',sans-serif;outline:none">
      <div style="font-size:11px;color:#fff;opacity:.9;margin-top:6px;text-shadow:0 1px 3px rgba(4,30,50,.6)" data-i18n="auth.pinNote">PINは暗号化して保存します。忘れると再発行できません</div>
    </div>
    <button id="ob-auth-btn" onclick="doAuth()" style="width:100%;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:15px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:12px">はじめる</button>
    <div id="ob-auth-err" style="font-size:12px;color:#FF7766;text-align:center;margin-bottom:10px;display:none"></div>
    <div id="ob-sub-link" style="text-align:center;font-size:11px;color:rgba(255,255,255,.3)">はじめて？ <a href="#" onclick="switchTab('new');return false;" style="color:rgba(170,221,238,.5)">新規登録</a></div>
  </div>
</div>

<!-- APP -->

  <div id="wp-layer" aria-hidden="true"></div>
  <div id="hdr">
    <div id="logo">umi<span id="cnt-lbl"></span>

function getCookie(name){
  const m=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  return m?decodeURIComponent(m[2]):null;
}
function setCookie(name,val,days=365){
  const d=new Date();d.setTime(d.getTime()+days*864e5);
  document.cookie=name+'='+encodeURIComponent(val)+';expires='+d.toUTCString()+';path=/;SameSite=Lax';
}

// 日付を端末の現地時刻で YYYY-MM-DD にする（朝の撮影が前日表示になるのを防ぐ）
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d.getTime())) return String(iso).slice(0,10);

async function api(action, payload={}){

function onWallpaperFile(input){
  const f=input.files&&input.files[0];
  input.value='';
  if(!f) return;
  const rd=new FileReader();
  rd.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      // 端末に保存できるよう縮小（長い辺1600px）。写り込んだ位置情報などはこの変換で消える
      const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let q=.82,url=c.toDataURL('image/jpeg',q);
      while(url.length>1500000&&q>.4){q-=.12;url=c.toDataURL('image/jpeg',q);} // 約1MB以内に
      try{
        localStorage.setItem(WP_KEY,url);
      }catch(e){
        alert(t('wp.saveFail'));return;
      }
      applyWallpaper();
      document.getElementById('wp-menu').classList.remove('show');
    };
    img.onerror=()=>alert(t('wp.loadFail'));
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
}

// ── 片手で拡大縮小：ダブルタップしてそのまま上下になぞる（Googleマップと同じ操作） ──
function enableOneFingerZoom(map){
  const el=map.getContainer();
  let lastTap=0,lastX=0,lastY=0,active=false,startY=0,startZoom=0,anchor=null,moved=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){active=false;return;}
    const t=e.touches[0],now=Date.now();
    const near=Math.hypot(t.clientX-lastX,t.clientY-lastY)<40;
    if(now-lastTap<300&&near){
      // 2回目のタップ：地図のドラッグを止めて、上下の動きで拡大縮小する
      active=true;moved=false;startY=t.clientY;startZoom=map.getZoom();
      const r=el.getBoundingClientRect();
      anchor=map.containerPointToLatLng([t.clientX-r.left,t.clientY-r.top]);
      map.dragging.disable();
      e.preventDefault();
    }
    lastTap=now;lastX=t.clientX;lastY=t.clientY;
  },{capture:true,passive:false});
  el.addEventListener('touchmove',e=>{
    if(!active) return;
    const dy=e.touches[0].clientY-startY;
    if(Math.abs(dy)>8) moved=true;
    if(!moved) return;
    e.preventDefault();e.stopPropagation();
    // 下へなぞると拡大、上へなぞると縮小（150pxで1段階）
    const z=Math.max(map.getMinZoom(),Math.min(map.getMaxZoom(),startZoom+dy/150));
    map.setZoomAround(anchor,z,{animate:false});
  },{capture:true,passive:false});
  let gestureAt=0;
  const end=e=>{
    if(!active) return;
    active=false;
    map.dragging.enable();
    e.preventDefault(); // この後に来るクリック・ダブルクリックを起こさない
    gestureAt=Date.now();
    lastTap=0;          // 次のタップは新しい1回目として数える
    if(!moved){
      // なぞらずに離した＝ふつうのダブルタップ：タップした場所を中心に拡大
      map.setZoomAround(anchor,Math.min(map.getMaxZoom(),Math.round(startZoom)+1));
    }
  };
  el.addEventListener('touchend',end,{capture:true,passive:false});
  el.addEventListener('touchcancel',end,{capture:true,passive:false});
  // PCのダブルクリック：クリックした場所を中心に拡大（Shiftを押しながらで縮小）
  map.on('dblclick',e=>{
    if(Date.now()-gestureAt<600) return; // タッチ操作の直後に届いたものは無視
    const d=e.originalEvent&&e.originalEvent.shiftKey?-1:1;
    map.setZoomAround(e.containerPoint,Math.round(map.getZoom())+d);
  });
}

const hiddenCats=new Set();
function toggleCat(cat){
  if(hiddenCats.has(cat)) hiddenCats.delete(cat); else hiddenCats.add(cat);
  // 全部消えるのは分かりにくいので、最後の1つは消さない
  if(hiddenCats.size===4){hiddenCats.delete(cat);return;}
  const chip=document.querySelector('.li[data-cat="'+cat+'"]');
  if(chip){chip.classList.toggle('off',hiddenCats.has(cat));chip.setAttribute('aria-pressed',String(!hiddenCats.has(cat)));}
  if(lmap){
    lmap.closePopup();
    Object.values(markerMap).forEach(m=>{
      if(!m||!m._umiRecord) return;
      const hide=hiddenCats.has(normCat(m._umiRecord.category));
      if(hide&&lmap.hasLayer(m)) lmap.removeLayer(m);
      if(!hide&&!lmap.hasLayer(m)) m.addTo(lmap);
    });
  }
  buildNavRecs();
}

async function loadRecords(){

  if(window._pins&&lmap) window._pins.forEach(m=>lmap.removeLayer(m));

  markerMap = {}; // リセット
  try{
    const res = await api('list');
    if(res.error) throw new Error(res.error);
    const data = res.records;
    preloaded = true;
    let slat=0,slng=0,cnt=0;
    if(Array.isArray(data)){
      data.forEach(r=>{
        if(r.lat&&r.lng){slat+=r.lat;slng+=r.lng;cnt++;}
      });
      window.allRecords=data;
      setTimeout(buildNavRecs, 100);
      updateStats();
      const clat=cnt>0?slat/cnt:35.316;
      const clng=cnt>0?slng/cnt:139.473;

    initMap(35.316,139.473,13);
  }
}

// ── ナビゲーション ──
let mineIdx=0, digestIdx=0;
let mineStarted=false, digestStarted=false;
let mineRecs=[], digestRecs=[];

function buildNavRecs(){
  if(!window.allRecords) return;
  mineRecs = window.allRecords
    .filter(r=>r.is_mine&&r.lat&&r.lng)
    .sort((a,b)=>new Date(a.photo_taken_at||a.created_at)-new Date(b.photo_taken_at||b.created_at));
  digestRecs = window.allRecords
    .filter(r=>!r.is_mine&&r.lat&&r.lng)
    .sort((a,b)=>{
      const sc={高:3,中:2,低:1};
      const d=(sc[b.mp_risk]||0)-(sc[a.mp_risk]||0);
      return d!==0?d:new Date(b.created_at)-new Date(a.created_at);
    });
  mineRecs=mineRecs.filter(r=>!hiddenCats.has(normCat(r.category)));
  digestRecs=digestRecs.filter(r=>!hiddenCats.has(normCat(r.category)));
  mineIdx=0; digestIdx=0; mineStarted=false; digestStarted=false;
  document.querySelectorAll('.nav-pair').forEach(e=>e.classList.remove('active'));
  updateNavInfo('mine');
  updateNavInfo('digest');
}

function updateNavInfo(type){
  const recs=type==='mine'?mineRecs:digestRecs;
  const idx=type==='mine'?mineIdx:digestIdx;
  const el=document.getElementById('nav-'+type+'-info');
  if(!el) return;
  const started=type==='mine'?mineStarted:digestStarted;
  const pairEl=document.getElementById('nav-'+type);
  if(pairEl) pairEl.classList.toggle('empty',recs.length===0);
  if(!started||recs.length===0){ el.innerHTML='<span class="tot">'+t('count',{n:recs.length})+'</span>'; return; }
  el.innerHTML=(idx+1)+'<span class="tot">/'+recs.length+'</span>';
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

function goTo(type, idx){
  const recs=type==='mine'?mineRecs:digestRecs;
  if(!recs||recs.length===0){
 return; }
  // 初めて押したときは、↓なら1件目、↑なら最後の記録へ
  const started=type==='mine'?mineStarted:digestStarted;
  if(!started) idx=idx>0?0:recs.length-1;
  idx=((idx%recs.length)+recs.length)%recs.length;
  if(type==='mine'){mineIdx=idx;mineStarted=true;}
  else{digestIdx=idx;digestStarted=true;}
  document.querySelectorAll('.nav-pair').forEach(e=>e.classList.toggle('active',e.id==='nav-'+type));
  if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){}
  updateNavInfo(type);
  const r=recs[idx];
  if(!lmap||!r.lat||!r.lng) return;

  lmap.closePopup();

  const bounds=lmap.getBounds();
  const inView=bounds.contains(L.latLng(r.lat,r.lng));

  if(inView){
    setTimeout(()=>openMarkerPopup(r), 100);
  } else {
    lmap.flyTo([r.lat,r.lng],15,{animate:true,duration:0.6});
    setTimeout(()=>openMarkerPopup(r), 700);
  }
}

function openMarkerPopup(r){
  const marker = r.id ? markerMap[r.id] : null;
  if(!marker){
 return; }

  // フォーカスアニメーション
  const el = marker.getElement();
  if(el){
    const pin = el.querySelector('.umi-pin');
    if(pin){
      pin.style.transition='transform .2s,box-shadow .2s';
      pin.style.transform='scale(2.5)';
      pin.style.boxShadow='0 0 0 10px rgba(255,255,255,.25)';
      setTimeout(()=>{pin.style.transform='';pin.style.boxShadow='';}, 700);
    }
  }
  marker.openPopup();
}

function initNav(){
  // ボタンイベント
  const mu=document.getElementById('mine-up');
  const md=document.getElementById('mine-dn');
  const du=document.getElementById('digest-up');
  const dd=document.getElementById('digest-dn');
  if(window._navInit) return; window._navInit=true; // 二重登録を防ぐ
  // タップで1件、押しっぱなしで連続して送る
  const hold=(btn,type,dir)=>{
    if(!btn) return;
    let t=null,iv=null;
    const step=()=>goTo(type,(type==='mine'?mineIdx:digestIdx)+dir);
    const stop=()=>{clearTimeout(t);clearInterval(iv);t=iv=null;};
    btn.addEventListener('pointerdown',e=>{e.preventDefault();step();t=setTimeout(()=>{iv=setInterval(step,450);},500);});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
    btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();step();}});
  };
  hold(mu,'mine',-1); hold(md,'mine',1); hold(du,'digest',-1); hold(dd,'digest',1);

  // ホバースクロール
  ['nav-mine','nav-digest'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    const type=id==='nav-mine'?'mine':'digest';
    let last=0;
    el.addEventListener('wheel',(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const now=Date.now();
      if(now-last<400) return;
      last=now;
      goTo(type,(type==='mine'?mineIdx:digestIdx)+(e.deltaY>0?1:-1));
    },{passive:false,capture:true});
    // 中央（ラベル部分）を上下にスワイプしても送れる
    const mid=el.querySelector('.nav-mid')||el;
    let ty=0;
    mid.addEventListener('touchstart',(e)=>{ty=e.touches[0].clientY;},{passive:true});
    mid.addEventListener('touchend',(e)=>{
      const d=ty-e.changedTouches[0].clientY;
      if(Math.abs(d)>30) goTo(type,(type==='mine'?mineIdx:digestIdx)+(d>0?1:-1));
    },{passive:true});
  });
}

// ── EXIF GPS ──
async function extractGPS(file){
  return new Promise(resolve=>{
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const view=new DataView(e.target.result);
        if(view.getUint16(0)!==0xFFD8){resolve(null);return;}
        let off=2;
        while(off<view.byteLength-4){
          const mk=view.getUint16(off);
          const sz=view.getUint16(off+2);
          if(mk===0xFFE1){resolve(parseGPS(view.buffer.slice(off+4,off+2+sz)));return;}
          if(sz<2) break;
          off+=2+sz;
        }
        resolve(null);
      }catch(e){resolve(null);}
    };
    rd.readAsArrayBuffer(file);
  });
}
function parseGPS(buf){
  try{
    const v=new DataView(buf),len=buf.byteLength;
    if(len<6) return null;
    const hdr=String.fromCharCode(v.getUint8(0),v.getUint8(1),v.getUint8(2),v.getUint8(3));
    if(hdr!=='Exif') return null;
    const t=6;
    const le=v.getUint16(t)===0x4949;
    const r16=o=>v.getUint16(t+o,le);
    const r32=o=>v.getUint32(t+o,le);
    const ifd=r32(4);
    if(t+ifd+2>len) return null;
    const n=r16(ifd);
    let go=-1;
    for(let i=0;i<n;i++){const b=ifd+2+i*12;if(t+b+12>len)break;if(r16(b)===0x8825){go=r32(b+8);break;}}
    if(go<0||t+go+2>len) return null;
    const gn=r16(go);
    let latR='N',lngR='E',lat=null,lng=null;
    const rat=o=>{if(o+8>len)return 0;const n=v.getUint32(o,le),d=v.getUint32(o+4,le);return d===0?0:n/d;};
    for(let i=0;i<gn;i++){
      const b=go+2+i*12;if(t+b+12>len)break;
      const tag=r16(b),vo=r32(b+8),ao=t+vo;
      if(tag===0x01&&ao<len) latR=String.fromCharCode(v.getUint8(ao));
      else if(tag===0x03&&ao<len) lngR=String.fromCharCode(v.getUint8(ao));
      else if((tag===0x02||tag===0x04)&&ao+24<=len){
        const deg=rat(ao)+rat(ao+8)/60+rat(ao+16)/3600;
        if(tag===0x02)lat=deg;else lng=deg;
      }
    }
    if(lat===null||lng===null) return null;
    return{lat:latR==='S'?-lat:lat,lng:lngR==='W'?-lng:lng};
  }catch(e){return null;}
}

// ── EXIF 撮影日 ──
async function extractPhotoDate(file){
  return new Promise(resolve=>{
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const view=new DataView(e.target.result);
        if(view.getUint16(0)!==0xFFD8){resolve(null);return;}
        let off=2;
        while(off<view.byteLength-4){
          const mk=view.getUint16(off);
          const sz=view.getUint16(off+2);
          if(mk===0xFFE1){
            const buf=e.target.result.slice(off+4,off+2+sz);
            resolve(parseDateFromExif(buf));
            return;
          }
          if(sz<2) break;
          off+=2+sz;
        }
        resolve(null);
      }catch(e){resolve(null);}
    };
    rd.readAsArrayBuffer(file);
  });
}

function parseDateFromExif(buffer){
  try{
    const view=new DataView(buffer);
    const len=buffer.byteLength;
    if(len<6) return null;
    const hdr=String.fromCharCode(view.getUint8(0),view.getUint8(1),view.getUint8(2),view.getUint8(3));
    if(hdr!=='Exif') return null;
    const t=6;
    const le=view.getUint16(t)===0x4949;
    const r16=o=>view.getUint16(t+o,le);
    const r32=o=>view.getUint32(t+o,le);
    const ifd=r32(4);
    if(t+ifd+2>len) return null;
    // IFDの中からタグを探して文字列を読む
    const readTag=(dir,tagId)=>{
      if(t+dir+2>len) return null;
      const n=r16(dir);
      for(let i=0;i<n;i++){
        const b=dir+2+i*12;
        if(t+b+12>len) break;
        if(r16(b)===tagId) return b;
      }
      return null;
    };
    const readAscii=(b)=>{
      const vo=r32(b+8);let str='';
      for(let j=0;j<19&&t+vo+j<len;j++){const c=view.getUint8(t+vo+j);if(c===0)break;str+=String.fromCharCode(c);}
      return str;
    };
    // 撮影日時(0x9003)はExifの下の階層にある。なければ更新日時(0x0132)
    let str='';
    const exifPtr=readTag(ifd,0x8769);
    if(exifPtr!==null){const b=readTag(r32(exifPtr+8),0x9003);if(b!==null)str=readAscii(b);}
    if(!str){const b=readTag(ifd,0x0132);if(b!==null)str=readAscii(b);}
    const m=str.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
    if(m){
      // 撮影した端末の現地時刻として扱う（Safariでも読める形式）
      const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
      if(!isNaN(d.getTime())) return d.toISOString();
    }
    return null;
  }catch(e){return null;}
}

// ── 画像圧縮 ──
function resizeAndCompress(dataUrl, maxPx, quality){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>maxPx||h>maxPx){
        if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
        else{w=Math.round(w*maxPx/h);h=maxPx;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src=dataUrl;
  });
}

// AI解析用：長辺1920px・品質0.82（約500KB〜1MB）
async function compressForAnalysis(dataUrl){
  return resizeAndCompress(dataUrl, 1920, 0.82);
}

// ストレージ保存用：長辺800px・品質0.75（約100〜200KB）
async function compressForStorage(dataUrl){
  return resizeAndCompress(dataUrl, 800, 0.75);
}

// ── ANALYZE ──
async function analyze(){
  if(userLat==null||userLng==null){alert(t('an.noGps'));return;}
  showLoad(t('an.loading'));
  try{
    // 10MB制限対策：送信前に圧縮
    const compressed=await compressForAnalysis(capturedUrl);
    const b64=compressed.split(',')[1];
    const r=await fetch(EDGE_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY},body:JSON.stringify({imageBase64:b64,lat:userLat,lng:userLng,photoTakenAt:photoTakenAt})});
    if(!r.ok) throw new Error('AI解析失敗');
    analysisResult=await r.json();
    hideLoad();
    // ごみ判定
    if(analysisResult.is_trash === false){
      alert(t('an.noTrash'));
      return;
    }
    showConfirm();
  }catch(e){hideLoad();alert(t('an.fail'));console.error(e);}
}

    </div>

      <div class="cs-label">GPS</div>

    </div>

      <div class="cs-label">${t('cf.date')}</div>

      <span class="cs-edit" onclick="editField('date')">${t('cf.edit')}</span>
    </div>
    <div class="cs-row">
      <div class="cs-label">${t('cf.items')}</div>
      <div class="cs-val">${esc(r.items||t('unknown')).replace(/\n/g,'<br>')}</div>
    </div>

      <div class="cs-val" style="color:${rc};font-weight:500">${esc(tv(r.mp_risk)||t('unknown'))}</div>

    <div class="cs-row">

    <div class="cs-row">

function editField(field){
  if(field==='location'){
    const cur=analysisResult.location_name||'';
    const val=prompt(t('cf.askPlace'), cur);
    if(val!==null){
      analysisResult.location_name=val;
      document.getElementById('cs-loc-val').textContent=val||t('unknown');
    }
  } else if(field==='date'){
    const cur=photoTakenAt?fmtDate(photoTakenAt):'';
    const val=prompt(t('cf.askDate'), cur);
    if(val!==null){
      // ISO形式に変換して保存
      const mm=String(val).trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
      const d=mm?new Date(+mm[1],+mm[2]-1,+mm[3],12,0,0):new Date(NaN);
      if(!isNaN(d.getTime())){
        photoTakenAt=d.toISOString();
        document.getElementById('cs-date-val').textContent=val;
      } else {
        alert(t('cf.badDate'));
      }
    }
  }
}

function changeCategory(cat){
  analysisResult.category=cat;
  // ボタンのactive状態を更新
  document.querySelectorAll('.cs-cat-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent===cat);
  });
  // バッジも更新
  document.getElementById('jtxt').textContent=t('an.doneCat',{c:cat});
  // カテゴリ表示色も更新（共通の catCol を使う）
  const col=catCol[cat]||'#22CCEE';
  document.querySelector('#conf-summary .cs-cat-btns').previousElementSibling.style.color=col;
}

async function send(){
  document.getElementById('confv').classList.remove('show');
  showLoad(t('sv.saving'));
  try{
    // ストレージ保存用に圧縮（長辺800px・約150KB）
    const compressedForUpload=await compressForStorage(capturedUrl);
    const compBlob=await(await fetch(compressedForUpload)).blob();
    const imgUrl=await upload(compBlob);
    const r=analysisResult;
    const rec={lat:userLat,lng:userLng,image_url:imgUrl,location_name:r.location_name,
      category:r.category||'SEA',category_reason:r.category_reason,photo_taken_at:photoTakenAt||r.photo_taken_at||null,
      items:r.items,material_type:r.material_type,size_class:r.size_class,
      estimated_weight_g:r.estimated_weight_g,degradation_level:r.degradation_level,
      mp_risk:r.mp_risk,drift_days_est:r.drift_days_est,beach_days_est:r.beach_days_est,
      mp_years_est:r.mp_years_est,manufacturer:r.manufacturer,brand_name:r.brand_name,
      product_name:r.product_name,barcode:r.barcode,origin_country:r.origin_country,
      import_route:r.import_route,distributor:r.distributor,retailer_category:r.retailer_category,
      recyclable:r.recyclable,design_issue:r.design_issue,affected_species:r.affected_species,
      human_route:r.human_route,discharge_route:r.discharge_route,source_category:r.source_category,
      runoff_risk:r.runoff_risk,analysis_json:r};
    const res=await api('save',{record:rec});
    if(res.error) throw new Error(res.error);
    const savedRec={...rec,created_at:new Date().toISOString(),...res.record,is_mine:true};
    hideLoad();
    if(!window.allRecords) window.allRecords=[];
    window.allRecords.unshift(savedRec);
    updateStats();
    document.getElementById('done-num').textContent=total;
    document.getElementById('imp-txt').textContent=r.summary||t('dn.saved');
    addPin(savedRec);
    buildNavRecs();
    document.getElementById('donev').classList.add('show');
  }catch(e){hideLoad();alert(t('sv.fail')+tv(e.message));console.error(e);}
}
