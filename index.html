<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>umi — 海のごみを記録する</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --sea-deep:#04111C;
  --sea-mid:#072A3F;
  --sea-light:#0E4A6A;
  --wave:#1A7A9A;
  --foam:#AADDEE;
  --white:#FFFFFF;
  --dot-sea:#22CCEE;
  --dot-river:#44BB88;
  --dot-city:#FFAA44;
  --dot-life:#FF7766;
  --radius:16px;
}
html,body{height:100%;background:var(--sea-deep);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden}

/* ── CONFIG SCREEN ── */
#config-screen{
  position:fixed;inset:0;background:var(--sea-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;z-index:1000;
}
#config-screen.hidden{display:none}
#config-logo{font-size:36px;font-weight:300;letter-spacing:0.2em;color:var(--foam);margin-bottom:8px}
#config-sub{font-size:12px;color:var(--foam);opacity:0.5;letter-spacing:0.1em;margin-bottom:40px}
.config-field{width:100%;max-width:400px;margin-bottom:16px}
.config-label{font-size:11px;color:var(--foam);opacity:0.6;letter-spacing:0.08em;margin-bottom:6px}
.config-input{
  width:100%;padding:12px 16px;
  background:rgba(26,122,154,0.1);
  border:1px solid rgba(26,122,154,0.3);
  border-radius:10px;color:var(--white);
  font-size:13px;font-family:'Inter',sans-serif;
  outline:none;
}
.config-input:focus{border-color:rgba(26,122,154,0.7)}
.config-input::placeholder{color:rgba(170,221,238,0.3)}
#config-btn{
  width:100%;max-width:400px;padding:14px;
  background:var(--wave);border:none;border-radius:var(--radius);
  color:var(--white);font-size:15px;font-weight:500;
  cursor:pointer;margin-top:8px;font-family:'Inter',sans-serif;
  letter-spacing:0.04em;
}
#config-note{
  font-size:10px;color:var(--foam);opacity:0.4;
  text-align:center;margin-top:16px;line-height:1.6;max-width:360px;
}

/* ── MAP VIEW ── */
#map-view{position:fixed;inset:0;display:flex;flex-direction:column}
#map-bg{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#04111C 0%,#061F2E 100%);
  overflow:hidden;
}
#map-bg::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(26,122,154,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(26,122,154,0.06) 1px,transparent 1px);
  background-size:40px 40px;
}

.dot{
  position:absolute;width:8px;height:8px;border-radius:50%;
  transform:translate(-50%,-50%);cursor:pointer;transition:transform 0.2s;
}
.dot::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid currentColor;opacity:0.4;animation:pulse 2.5s infinite;
}
.dot:hover{transform:translate(-50%,-50%) scale(1.6)}
.dot.sea{background:var(--dot-sea);color:var(--dot-sea)}
.dot.river{background:var(--dot-river);color:var(--dot-river)}
.dot.city{background:var(--dot-city);color:var(--dot-city)}
.dot.life{background:var(--dot-life);color:var(--dot-life)}
@keyframes pulse{0%{transform:scale(1);opacity:0.4}70%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:0}}

#header{
  position:relative;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top,16px) 20px 12px;
  background:linear-gradient(180deg,rgba(4,17,28,0.95) 0%,rgba(4,17,28,0) 100%);
}
#logo{font-size:22px;font-weight:300;letter-spacing:0.15em;color:var(--foam)}
#counter-num{font-size:20px;font-weight:500;color:var(--white);line-height:1;text-align:right}
#counter-label{font-size:10px;color:var(--foam);opacity:0.7;letter-spacing:0.08em}

#legend{
  position:relative;z-index:20;
  display:flex;gap:12px;padding:8px 20px;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--foam);opacity:0.7;letter-spacing:0.04em}
.legend-dot{width:6px;height:6px;border-radius:50%}

#map-area{flex:1;position:relative;overflow:hidden}

#bottom-bar{
  position:relative;z-index:20;
  padding:0 20px env(safe-area-inset-bottom,20px);
  background:linear-gradient(0deg,rgba(4,17,28,0.98) 60%,rgba(4,17,28,0) 100%);
  padding-top:32px;
}
#camera-btn{
  display:flex;align-items:center;justify-content:center;
  width:64px;height:64px;border-radius:50%;
  background:var(--wave);border:none;cursor:pointer;
  margin:0 auto 20px;transition:transform 0.15s;
  animation:glow 3s infinite;
}
#camera-btn:active{transform:scale(0.92)}
#camera-btn svg{width:28px;height:28px;fill:none;stroke:var(--white);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(26,122,154,0.5)}70%{box-shadow:0 0 0 16px rgba(26,122,154,0)}100%{box-shadow:0 0 0 0 rgba(26,122,154,0)}}

#stats-row{display:flex;justify-content:space-around;padding-bottom:4px}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px}
.stat-num{font-size:16px;font-weight:500;color:var(--white)}
.stat-label{font-size:9px;color:var(--foam);opacity:0.6;letter-spacing:0.06em}

/* ── CAMERA VIEW ── */
#camera-view{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100}
#camera-view.active{display:flex}
#cam-preview{flex:1;position:relative;overflow:hidden;background:#000}
#cam-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cam-frame-inner{
  width:72%;aspect-ratio:1;
  border:1.5px solid rgba(255,255,255,0.4);border-radius:12px;position:relative;
}
#cam-frame-inner::before{content:'';position:absolute;top:-1px;left:-1px;width:20px;height:20px;border-top:2px solid var(--white);border-left:2px solid var(--white);border-radius:3px 0 0 0}
#cam-frame-inner::after{content:'';position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;border-bottom:2px solid var(--white);border-right:2px solid var(--white);border-radius:0 0 3px 0}

#shutter-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px env(safe-area-inset-bottom,20px);
  background:rgba(4,17,28,0.95);
}
#back-btn{width:44px;height:44px;background:none;border:1.5px solid rgba(255,255,255,0.3);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#back-btn svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:2;stroke-linecap:round}
#shutter{width:68px;height:68px;border-radius:50%;background:var(--white);border:none;cursor:pointer;transition:transform 0.1s;box-shadow:0 0 0 3px rgba(255,255,255,0.15)}
#shutter:active{transform:scale(0.88)}
#gallery-btn{width:44px;height:44px;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
#gallery-btn svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:1.8}

/* ── CONFIRM VIEW ── */
#confirm-view{position:fixed;inset:0;background:var(--sea-deep);display:none;flex-direction:column;z-index:200}
#confirm-view.active{display:flex}
#confirm-img{flex:1;position:relative;overflow:hidden}
#confirm-preview{width:100%;height:100%;object-fit:cover}
#judge-overlay{
  position:absolute;bottom:0;left:0;right:0;padding:20px;
  background:linear-gradient(0deg,rgba(4,17,28,0.98) 0%,rgba(4,17,28,0) 100%);
}
#judge-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:20px;
  background:rgba(34,204,238,0.15);border:1px solid rgba(34,204,238,0.4);
  margin-bottom:10px;
}
#judge-text{font-size:12px;color:var(--dot-sea);letter-spacing:0.04em}
#judge-items{font-size:12px;color:var(--foam);line-height:1.7;opacity:0.9;max-height:120px;overflow-y:auto}
#confirm-btns{padding:16px 24px env(safe-area-inset-bottom,20px);background:var(--sea-deep);display:flex;gap:12px}
#btn-retry{flex:1;padding:14px;background:none;border:1.5px solid rgba(255,255,255,0.2);border-radius:var(--radius);color:var(--foam);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
#btn-send{flex:2;padding:14px;background:var(--wave);border:none;border-radius:var(--radius);color:var(--white);font-size:14px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}

/* ── LOADING ── */
#loading-overlay{
  position:fixed;inset:0;background:rgba(4,17,28,0.92);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;z-index:500;
}
#loading-overlay.active{display:flex}
.spinner{width:40px;height:40px;border:2px solid rgba(26,122,154,0.3);border-top-color:var(--wave);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{font-size:13px;color:var(--foam);opacity:0.7;letter-spacing:0.06em}

/* ── DONE VIEW ── */
#done-view{position:fixed;inset:0;background:var(--sea-deep);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:0}
#done-view.active{display:flex}
#done-ripple{width:120px;height:120px;border-radius:50%;background:rgba(26,122,154,0.15);border:1px solid rgba(26,122,154,0.4);display:flex;align-items:center;justify-content:center;margin-bottom:32px;position:relative}
#done-ripple::before{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(26,122,154,0.2);animation:expand 1.5s ease-out forwards}
@keyframes expand{from{transform:scale(0.8);opacity:1}to{transform:scale(1.4);opacity:0}}
#done-ripple svg{width:48px;height:48px;fill:none;stroke:var(--wave);stroke-width:1.5;stroke-linecap:round}
#done-num{font-size:48px;font-weight:300;color:var(--white);letter-spacing:-0.02em;line-height:1;margin-bottom:6px}
#done-label{font-size:12px;color:var(--foam);opacity:0.6;letter-spacing:0.08em;margin-bottom:40px}
#done-impact{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 32px;background:rgba(26,122,154,0.1);border:1px solid rgba(26,122,154,0.25);border-radius:var(--radius);width:82%;max-width:320px;margin-bottom:40px}
.impact-line{font-size:12px;color:var(--foam);opacity:0.8;text-align:center;line-height:1.5}
.impact-line strong{color:var(--white);font-weight:500}
#btn-back-map{padding:14px 40px;background:none;border:1.5px solid rgba(255,255,255,0.2);border-radius:var(--radius);color:var(--foam);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}

/* ── DOT PANEL ── */
#dot-panel{position:fixed;bottom:0;left:0;right:0;background:rgba(6,26,40,0.98);border-top:1px solid rgba(26,122,154,0.3);border-radius:20px 20px 0 0;padding:16px 20px env(safe-area-inset-bottom,20px);z-index:50;transform:translateY(100%);transition:transform 0.3s ease}
#dot-panel.open{transform:translateY(0)}
#panel-handle{width:36px;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 16px}
#panel-content{font-size:12px;color:var(--foam);line-height:1.7;opacity:0.9}
#panel-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--foam);font-size:20px;cursor:pointer;opacity:0.5}

#file-input{display:none}
#cam-canvas{display:none}
</style>
</head>
<body>

<!-- ══ CONFIG SCREEN ══ -->
<div id="config-screen">
  <div id="config-logo">umi</div>
  <div id="config-sub">SEA PLASTIC DATABASE</div>
  <div class="config-field">

    <input class="config-input" id="inp-url" type="text" placeholder="https://xxxx.supabase.co">

<!-- ══ MAP VIEW ══ -->
<div id="map-view">
  <div id="map-bg"></div>
  <div id="header">
    <div id="logo">umi</div>
    <div>
      <div id="counter-num">0</div>
      <div id="counter-label">records today</div>
    </div>
  </div>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--dot-sea)"></div>sea</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--dot-river)"></div>river</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--dot-city)"></div>city</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--dot-life)"></div>life</div>
  </div>
  <div id="map-area"></div>
  <div id="bottom-bar">
    <button id="camera-btn" onclick="openCamera()">

</div>

<!-- ══ CAMERA VIEW ══ -->
<div id="camera-view">
  <div id="cam-preview">
    <video id="cam-video" autoplay playsinline muted></video>

    </button>

<!-- ══ CONFIRM VIEW ══ -->

<!-- ══ LOADING ══ -->

    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke-width="2"/></svg>

    <div class="impact-line" id="impact-text">記録されました</div>

  </div>

<!-- ── DOT PANEL ── -->

<script>
// ══ CONFIG ══
let CFG = {url:'', anon:'', claude:''};
let capturedBlob = null;
let capturedDataUrl = null;
let analysisResult = null;
let userLat = null, userLng = null;
let videoStream = null;
let totalCount = 0;

function saveConfig(){
  const url = document.getElementById('inp-url').value.trim();
  const anon = document.getElementById('inp-anon').value.trim();
  const claude = document.getElementById('inp-claude').value.trim();
  if(!url || !anon || !claude){ alert('すべて入力してください'); return; }
  CFG = {url, anon, claude};
  localStorage.setItem('umi_cfg', JSON.stringify(CFG));
  document.getElementById('config-screen').classList.add('hidden');
  init();
}

function loadConfig(){
  const saved = localStorage.getItem('umi_cfg');
  if(saved){
    try{ CFG = JSON.parse(saved); return true; }catch(e){}
  }
  return false;
}

// ══ SUPABASE ══
async function sb(path, method='GET', body=null){
  const headers = {
    'apikey': CFG.anon,
    'Authorization': 'Bearer ' + CFG.anon,
    'Content-Type': 'application/json',
    'Prefer': method==='POST' ? 'return=representation' : ''
  };
  const res = await fetch(CFG.url + '/rest/v1/' + path, {
    method, headers,
    body: body ? JSON.stringify(body) : null
  });
  if(!res.ok){
    const err = await res.text();
    throw new Error(err);
  }
  return res.json().catch(()=>({}));
}

async function uploadImage(blob){
  const filename = 'record_' + Date.now() + '.jpg';
  const res = await fetch(CFG.url + '/storage/v1/object/images/' + filename, {
    method: 'POST',
    headers: {
      'apikey': CFG.anon,
      'Authorization': 'Bearer ' + CFG.anon,
      'Content-Type': 'image/jpeg'
    },
    body: blob
  });
  if(!res.ok) throw new Error('画像アップロード失敗');
  return CFG.url + '/storage/v1/object/public/images/' + filename;
}

// ══ CLAUDE API ══
async function analyzeImage(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const prompt = `あなたは海洋プラスチック汚染の専門家です。この画像に写っているごみを解析してください。

以下の項目をJSON形式で返してください。不明な項目は"不明"としてください。

{
  "items": "検出されたごみの一覧（改行区切り）",
  "material_type": "主な素材（PET/PP/PE/PS/ABS/ガラス/金属/その他）",
  "size_class": "大/中/小/MP（マイクロプラスチック）",
  "estimated_weight_g": 推定質量(g、数値のみ),
  "degradation_level": 劣化度(1-5、数値のみ),
  "mp_risk": "高/中/低",
  "drift_days_est": "海面漂流推定期間",
  "beach_days_est": "ビーチ滞留推定期間",
  "mp_years_est": "粒子化までの推定年数",
  "manufacturer": "推定製造メーカー（読み取れた場合）",
  "brand_name": "ブランド名（読み取れた場合）",
  "product_name": "製品名（読み取れた場合）",
  "barcode": "バーコード（読み取れた場合）",
  "origin_country": "推定製造国",
  "design_issue": "設計上の問題点",
  "affected_species": "影響を受ける可能性のある生物種",
  "human_route": "人体到達経路",
  "discharge_route": "推定排出経路",
  "source_category": "推定排出元カテゴリ",
  "category": "SEA/RIVER/CITY/LIFEのいずれか（画像から判断）",
  "category_reason": "カテゴリの判定根拠",
  "runoff_risk": "流出リスク（高/中/低）",
  "summary": "この記録の要約（1-2文）"
}

JSONのみ返してください。`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': CFG.claude,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 }},
          { type: 'text', text: prompt }
        ]
      }]
    })
  });
  if(!res.ok) throw new Error('AI解析失敗');
  const data = await res.json();
  const text = data.content[0].text;
  const clean = text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

// ══ MAP ══
function renderDot(record){
  const area = document.getElementById('map-area');
  const rect = area.getBoundingClientRect();
  const dot = document.createElement('div');
  dot.className = 'dot ' + (record.category||'sea').toLowerCase();
  // lat/lngを画面座標に変換（簡易：日本付近を想定）
  const x = ((record.lng - 130) / 20) * 100;
  const y = ((46 - record.lat) / 16) * 100;
  dot.style.left = Math.max(5,Math.min(95,x)) + '%';
  dot.style.top = Math.max(5,Math.min(95,y)) + '%';
  dot.onclick = () => showPanel(record);
  area.appendChild(dot);
}

async function loadRecords(){
  try{
    const data = await sb('records?select=*&order=created_at.desc&limit=100');
    let sea=0,city=0;
    if(Array.isArray(data)){
      data.forEach(r=>{
        renderDot(r);
        const cat=(r.category||'').toUpperCase();
        if(cat==='SEA'||cat==='RIVER') sea++;
        if(cat==='CITY'||cat==='LIFE') city++;
      });
      totalCount = data.length;
      document.getElementById('counter-num').textContent = totalCount;
      document.getElementById('stat-total').textContent = totalCount;
      document.getElementById('stat-sea').textContent = sea;
      document.getElementById('stat-city').textContent = city;
    }
  }catch(e){
    console.error('記録の読み込みエラー:', e);
  }
}

function showPanel(r){
  const colors = {SEA:'var(--dot-sea)',RIVER:'var(--dot-river)',CITY:'var(--dot-city)',LIFE:'var(--dot-life)'};
  const cat = (r.category||'SEA').toUpperCase();
  const col = colors[cat] || 'var(--dot-sea)';
  document.getElementById('panel-content').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <div style="width:8px;height:8px;border-radius:50%;background:${col}"></div>
      <span style="font-size:10px;letter-spacing:0.08em;color:var(--foam);opacity:0.7">${cat} — ${r.created_at?r.created_at.slice(0,10):''}</span>
    </div>
    ${r.items ? `<div style="margin-bottom:8px">${r.items.replace(/\n/g,'<br>')}</div>` : ''}
    ${r.manufacturer&&r.manufacturer!=='不明' ? `<div style="font-size:11px;color:var(--foam);opacity:0.7;margin-bottom:4px">メーカー：${r.manufacturer}</div>` : ''}
    ${r.brand_name&&r.brand_name!=='不明' ? `<div style="font-size:11px;color:var(--foam);opacity:0.7;margin-bottom:4px">ブランド：${r.brand_name}</div>` : ''}
    ${r.mp_risk ? `<div style="font-size:11px;color:${r.mp_risk==='高'?'#FF7766':r.mp_risk==='中'?'#FFAA44':'#44BB88'}">MP発生リスク：${r.mp_risk}</div>` : ''}
  `;
  document.getElementById('dot-panel').classList.add('open');
}
function closePanel(){ document.getElementById('dot-panel').classList.remove('open') }

// ══ GPS ══
function getLocation(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude, lng:p.coords.longitude}),
      ()=>resolve(null),
      {timeout:5000}
    );
  });
}

// ══ CAMERA ══
async function openCamera(){
  document.getElementById('camera-view').classList.add('active');
  try{
    videoStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    document.getElementById('cam-video').srcObject = videoStream;
  }catch(e){
    console.log('カメラアクセス不可');
  }
  // GPS取得
  const loc = await getLocation();
  if(loc){ userLat = loc.lat; userLng = loc.lng; }
}

function closeCamera(){
  if(videoStream){ videoStream.getTracks().forEach(t=>t.stop()); videoStream=null; }
  document.getElementById('camera-view').classList.remove('active');
}

function takePhoto(){
  const video = document.getElementById('cam-video');
  const canvas = document.getElementById('cam-canvas');
  if(video.videoWidth){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0);
    canvas.toBlob(blob=>{
      capturedBlob = blob;
      capturedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
      closeCamera();
      runAnalysis();
    },'image/jpeg',0.85);
  } else {
    alert('カメラが起動していません。ギャラリーから選んでください。');
  }
}

function handleFile(input){
  if(!input.files[0]) return;
  const file = input.files[0];
  capturedBlob = file;
  const reader = new FileReader();
  reader.onload = e=>{
    capturedDataUrl = e.target.result;
    closeCamera();
    runAnalysis();
  };
  reader.readAsDataURL(file);
}

async function runAnalysis(){
  showLoading('AI解析中...');
  try{
    analysisResult = await analyzeImage(capturedDataUrl);
    hideLoading();
    showConfirm();
  }catch(e){
    hideLoading();
    alert('解析に失敗しました。もう一度お試しください。');
    console.error(e);
  }
}

// ══ CONFIRM ══
function showConfirm(){
  document.getElementById('confirm-preview').src = capturedDataUrl;
  const r = analysisResult;
  document.getElementById('judge-text').textContent = 'AI解析完了 — ' + (r.category||'SEA');
  document.getElementById('judge-items').innerHTML = (r.items||'').replace(/\n/g,'<br>');
  document.getElementById('confirm-view').classList.add('active');
}

function retakePhoto(){
  document.getElementById('confirm-view').classList.remove('active');
  openCamera();
}

async function sendPhoto(){
  document.getElementById('confirm-view').classList.remove('active');
  showLoading('保存中...');
  try{
    // 画像アップロード
    const imageUrl = await uploadImage(capturedBlob);
    // DB保存
    const r = analysisResult;
    const record = {
      lat: userLat,
      lng: userLng,
      image_url: imageUrl,
      category: r.category || 'SEA',
      category_reason: r.category_reason,
      items: r.items,
      material_type: r.material_type,
      size_class: r.size_class,
      estimated_weight_g: r.estimated_weight_g,
      degradation_level: r.degradation_level,
      mp_risk: r.mp_risk,
      drift_days_est: r.drift_days_est,
      beach_days_est: r.beach_days_est,
      mp_years_est: r.mp_years_est,
      manufacturer: r.manufacturer,
      brand_name: r.brand_name,
      product_name: r.product_name,
      barcode: r.barcode,
      origin_country: r.origin_country,
      design_issue: r.design_issue,
      affected_species: r.affected_species,
      human_route: r.human_route,
      discharge_route: r.discharge_route,
      source_category: r.source_category,
      runoff_risk: r.runoff_risk,
      analysis_json: r
    };
    await sb('records', 'POST', record);
    hideLoading();
    totalCount++;
    document.getElementById('done-num').textContent = totalCount;
    document.getElementById('impact-text').textContent = r.summary || '記録されました';
    if(userLat && userLng) renderDot({...record, category: r.category||'SEA'});
    document.getElementById('counter-num').textContent = totalCount;
    document.getElementById('stat-total').textContent = totalCount;
    document.getElementById('done-view').classList.add('active');
  }catch(e){
    hideLoading();
    alert('保存に失敗しました: ' + e.message);
    console.error(e);
  }
}

function backToMap(){
  document.getElementById('done-view').classList.remove('active');
}

// ══ LOADING ══
function showLoading(text){
  document.getElementById('loading-text').textContent = text;
  document.getElementById('loading-overlay').classList.add('active');
}
function hideLoading(){
  document.getElementById('loading-overlay').classList.remove('active');
}

// ══ INIT ══
async function init(){
  await loadRecords();
  document.getElementById('map-area').addEventListener('click', closePanel);
}

// 起動
if(loadConfig()){
  document.getElementById('config-screen').classList.add('hidden');
  init();
}
</script>
