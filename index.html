<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>umi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --deep:#04111C;--wave:#1A7A9A;--foam:#AADDEE;--white:#FFFFFF;
  --sea:#22CCEE;--river:#44BB88;--city:#FFAA44;--ground:#FF7766;
  --r:16px;
}
html,body{height:100%;background:var(--deep);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden}

/* ONBOARDING */
#ob{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;z-index:1000;background:linear-gradient(180deg,#0A3A6A 0%,#1A6A9A 30%,#3A9AC0 60%,#8CCFE8 80%,#1A4A6A 100%)}
#ob-logo{font-size:32px;font-weight:300;letter-spacing:.2em;color:var(--foam);margin-bottom:36px}
.ob-row{display:flex;align-items:flex-start;gap:14px;width:100%;max-width:320px;margin-bottom:24px}
.ob-ic{width:34px;height:34px;border-radius:50%;background:rgba(26,122,154,.2);border:1px solid rgba(26,122,154,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.ob-tx{font-size:13px;color:var(--foam);line-height:1.6}
.ob-tx strong{color:var(--white)}
#inp-nick:focus,#inp-pin:focus{border-color:rgba(26,122,154,.6)!important}
#ob-btn{width:100%;max-width:320px;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;font-family:'Inter',sans-serif}

/* MAP */
#app{position:fixed;inset:0;display:none;flex-direction:column;background:linear-gradient(180deg,#0A3A6A 0%,#1A6A9A 30%,#3A9AC0 60%,#8CCFE8 80%,#1A4A6A 100%)}
#app.show{display:flex}
#map{flex:1;position:relative;z-index:1}
.leaflet-container{z-index:1}
#leafmap{position:absolute;inset:0}
.leaflet-tile{filter:brightness(.85) saturate(.7)}

/* HEADER */
#hdr{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,16px) 20px 12px;background:linear-gradient(180deg,rgba(4,17,28,.95) 0%,transparent 100%)}
#logo{font-size:22px;font-weight:300;letter-spacing:.15em;color:var(--foam)}
#cnt-num{font-size:20px;font-weight:500;text-align:right}
#cnt-lbl{font-size:10px;color:var(--foam);opacity:.7;letter-spacing:.08em}

/* LEGEND */
#leg{position:relative;z-index:20;display:flex;gap:12px;padding:6px 20px}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--foam);opacity:.7}
.ld{width:6px;height:6px;border-radius:50%}

/* BOTTOM */
#btm{position:relative;z-index:20;padding:0 20px env(safe-area-inset-bottom,20px);background:linear-gradient(0deg,rgba(4,17,28,.98) 60%,transparent 100%);padding-top:28px}
#cam-btn{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--wave);border:none;cursor:pointer;margin:0 auto 18px;animation:glow 3s infinite}
#cam-btn:active{transform:scale(.92)}
#cam-btn svg{width:28px;height:28px;fill:none;stroke:var(--white);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(26,122,154,.5)}70%{box-shadow:0 0 0 16px rgba(26,122,154,0)}100%{box-shadow:0 0 0 0 rgba(26,122,154,0)}}
#stats{display:flex;justify-content:space-around;padding-bottom:4px}
.st{display:flex;flex-direction:column;align-items:center;gap:3px}
.sn{font-size:16px;font-weight:500}
.sl{font-size:9px;color:var(--foam);opacity:.6;letter-spacing:.06em}

/* CAMERA */
#camv{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100}
#camv.show{display:flex}
#campre{flex:1;position:relative;overflow:hidden}
#camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camfrm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#camfrm-in{width:72%;aspect-ratio:1;border:1.5px solid rgba(255,255,255,.4);border-radius:12px;position:relative}
#camfrm-in::before{content:'';position:absolute;top:-1px;left:-1px;width:20px;height:20px;border-top:2px solid var(--white);border-left:2px solid var(--white);border-radius:3px 0 0 0}
#camfrm-in::after{content:'';position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;border-bottom:2px solid var(--white);border-right:2px solid var(--white);border-radius:0 0 3px 0}
#shtbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px env(safe-area-inset-bottom,20px);background:rgba(4,17,28,.95)}
#backbtn{width:44px;height:44px;background:none;border:1.5px solid rgba(255,255,255,.3);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#backbtn svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:2;stroke-linecap:round}
#shutter{width:68px;height:68px;border-radius:50%;background:var(--white);border:none;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
#shutter:active{transform:scale(.88)}
#gallbtn{width:44px;height:44px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#gallbtn svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:1.8}

/* CONFIRM */
#confv{position:fixed;inset:0;background:var(--deep);display:none;flex-direction:column;z-index:200}
#confv.show{display:flex}
#confimg{flex:1;position:relative;overflow:hidden}
#confpre{width:100%;height:100%;object-fit:cover}
#jover{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(0deg,rgba(4,17,28,.98) 0%,transparent 100%)}
#jbadge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(34,204,238,.15);border:1px solid rgba(34,204,238,.4);margin-bottom:10px}
#jtxt{font-size:12px;color:var(--sea);letter-spacing:.04em}
#jitems{font-size:12px;color:var(--foam);line-height:1.7;opacity:.9;max-height:120px;overflow-y:auto}
#confbtns{padding:16px 24px env(safe-area-inset-bottom,20px);background:var(--deep);display:flex;gap:12px}
#btn-retry{flex:1;padding:14px;background:none;border:1.5px solid rgba(255,255,255,.2);border-radius:var(--r);color:var(--foam);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
#btn-send{flex:2;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:14px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}

/* LOADING */
#ldg{position:fixed;inset:0;background:rgba(4,17,28,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:500}
#ldg.show{display:flex}
.spin{width:40px;height:40px;border:2px solid rgba(26,122,154,.3);border-top-color:var(--wave);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ldgtxt{font-size:13px;color:var(--foam);opacity:.7;letter-spacing:.06em}

/* DONE */
#donev{position:fixed;inset:0;background:var(--deep);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300}
#donev.show{display:flex}
#done-rip{width:120px;height:120px;border-radius:50%;background:rgba(26,122,154,.15);border:1px solid rgba(26,122,154,.4);display:flex;align-items:center;justify-content:center;margin-bottom:32px}
#done-rip svg{width:48px;height:48px;fill:none;stroke:var(--wave);stroke-width:1.5;stroke-linecap:round}
#done-num{font-size:48px;font-weight:300;line-height:1;margin-bottom:6px}
#done-lbl{font-size:12px;color:var(--foam);opacity:.6;letter-spacing:.08em;margin-bottom:36px}
#done-imp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 28px;background:rgba(26,122,154,.1);border:1px solid rgba(26,122,154,.25);border-radius:var(--r);width:82%;max-width:320px;margin-bottom:36px}
.imp-ln{font-size:12px;color:var(--foam);opacity:.8;text-align:center;line-height:1.5}
.imp-ln strong{color:var(--white);font-weight:500}
#btn-back{padding:14px 40px;background:none;border:1.5px solid rgba(255,255,255,.2);border-radius:var(--r);color:var(--foam);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}

/* POPUP */
.leaflet-popup-content-wrapper{
  background:rgba(8,24,40,.82)!important;
  backdrop-filter:blur(20px)!important;
  -webkit-backdrop-filter:blur(20px)!important;
  border:1px solid rgba(100,200,255,.18)!important;
  border-radius:18px!important;
  box-shadow:0 8px 40px rgba(0,0,0,.35)!important;
  color:var(--white)!important;
  padding:0!important;
}
.leaflet-popup-content{margin:0!important;width:270px!important}
.leaflet-popup-tip-container{display:none!important}
.leaflet-popup-close-button{
  color:rgba(255,255,255,.45)!important;
  font-size:20px!important;
  top:10px!important;right:12px!important;
  z-index:10;line-height:1!important;
}
.leaflet-popup-close-button:hover{color:rgba(255,255,255,.9)!important}
/* 写真 */
.umi-pop img{width:100%;height:170px;object-fit:cover;border-radius:18px 18px 0 0;display:block}
/* 本文 */
.umi-pop-body{padding:12px 14px 14px}
/* ヘッダー行 */
.umi-pop-hdr{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.umi-pop-badge{padding:2px 9px;border-radius:20px;font-size:10px;letter-spacing:.07em;font-weight:600;background:rgba(255,255,255,.1)}
.umi-pop-loc{font-size:11px;color:rgba(255,255,255,.55);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.umi-pop-date{font-size:10px;color:rgba(255,255,255,.35);margin-left:auto;flex-shrink:0}
/* 区切り */
.umi-pop-div{height:1px;background:rgba(255,255,255,.07);margin:8px 0}
/* ごみ品目 */
.umi-pop-items{font-size:12px;color:rgba(255,255,255,.88);line-height:1.65;margin-bottom:8px}
/* 数値行 */
.umi-pop-nums{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.umi-pop-num{
  flex:1;min-width:70px;
  padding:5px 8px;border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
}
.umi-pop-num-label{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.05em;margin-bottom:2px}
.umi-pop-num-val{font-size:12px;font-weight:500;color:rgba(255,255,255,.9)}
/* 推定関与者 */
.umi-pop-stakeholder{
  padding:6px 10px;border-radius:10px;
  background:rgba(26,122,154,.15);
  border:1px solid rgba(26,122,154,.25);
  margin-bottom:8px;
}
.umi-pop-stakeholder-label{font-size:9px;color:rgba(170,221,238,.6);letter-spacing:.06em;margin-bottom:3px}
.umi-pop-stakeholder-val{font-size:12px;color:rgba(255,255,255,.85)}
/* 排出経路 */
.umi-pop-route{font-size:11px;color:rgba(255,255,255,.5);line-height:1.5}

#camcanvas{display:none}
#filein{display:none}

/* ── ナビゲーションボタン ── */
.nav-pair{
  position:fixed;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  z-index:9999;
  padding:8px;
  border-radius:20px;
  cursor:pointer;
  pointer-events:all;
}
.nav-pair:hover{
  background:rgba(26,122,154,.08);
}
#nav-mine{ left:12px; bottom:160px; }
#nav-digest{ right:12px; bottom:160px; }
.nav-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(8,24,40,.65);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(100,200,255,.25);
  color:rgba(255,255,255,.8);font-size:20px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
  user-select:none;
  line-height:1;
  pointer-events:all;
  position:relative;
  z-index:9999;
}
.nav-btn:hover,.nav-btn:focus{
  background:rgba(26,122,154,.5);
  border-color:rgba(100,200,255,.5);
  color:var(--white);
  outline:none;
}
.nav-btn:active{transform:scale(.92)}
.nav-label{
  font-size:9px;color:rgba(170,221,238,.6);
  text-align:center;letter-spacing:.08em;font-weight:500;
}
.nav-count{
  font-size:10px;color:rgba(170,221,238,.5);
  text-align:center;min-height:14px;
}



.umi-pin{
  width:12px;height:12px;border-radius:50%;
  background:var(--c);
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 0 0 3px rgba(255,255,255,.2);
  transition:transform .15s ease,box-shadow .15s ease;
  cursor:pointer;
}
.leaflet-marker-icon:hover .umi-pin{
  transform:scale(1.6);
  box-shadow:0 0 0 5px rgba(255,255,255,.3);
}
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="ob">
  <div id="ob-logo">umi</div>

  <!-- 説明3項目 -->
  <div style="width:100%;max-width:320px;margin-bottom:24px">
    <div class="ob-row"><div class="ob-ic">📍</div><div class="ob-tx"><strong>写真のGPS情報を使います</strong><br>撮影時の位置情報が自動で記録されます</div></div>
    <div class="ob-row"><div class="ob-ic">🔒</div><div class="ob-tx"><strong>ブラウザのGPSは使いません</strong><br>デバイスの現在地には一切アクセスしません</div></div>
    <div class="ob-row"><div class="ob-ic">📷</div><div class="ob-tx"><strong>位置情報オンで撮影した写真を</strong><br>GPS情報のない写真は受け付けられません</div></div>
  </div>

  <!-- ログイン・新規画面 -->
  <div id="ob-auth" style="width:100%;max-width:320px">
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--foam);opacity:.6;letter-spacing:.06em;margin-bottom:6px">ニックネーム</div>
      <input id="inp-nick" type="text" placeholder="例: umi" maxlength="20"
        style="width:100%;padding:12px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:14px;font-family:'Inter',sans-serif;outline:none">
    </div>
    <div style="margin-bottom:20px">
      <div style="font-size:11px;color:var(--foam);opacity:.6;letter-spacing:.06em;margin-bottom:6px">PIN（4桁）</div>
      <input id="inp-pin" type="password" placeholder="0000" maxlength="4" inputmode="numeric"
        style="width:100%;padding:12px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:18px;letter-spacing:.3em;font-family:'Inter',sans-serif;outline:none">
    </div>
    <button id="ob-auth-btn" onclick="doAuth()" style="width:100%;padding:14px;background:var(--wave);border:none;border-radius:var(--r);color:var(--white);font-size:15px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:12px">はじめる</button>
    <div id="ob-auth-err" style="font-size:12px;color:#FF7766;text-align:center;margin-bottom:10px;display:none"></div>
    <div id="ob-sub-link" style="text-align:center;font-size:11px;color:rgba(255,255,255,.3)">はじめて？ <a href="#" onclick="switchTab('new');return false;" style="color:rgba(170,221,238,.5)">新規登録</a></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="hdr">
    <div id="logo">umi</div>
    <div><div id="cnt-num">0</div><div id="cnt-lbl">records</div></div>
  </div>
  <div id="leg">
    <div class="li"><div class="ld" style="background:var(--sea)"></div>sea</div>
    <div class="li"><div class="ld" style="background:var(--river)"></div>river</div>
    <div class="li"><div class="ld" style="background:var(--city)"></div>city</div>
    <div class="li"><div class="ld" style="background:var(--life)"></div>ground</div>
  </div>
  <div id="map">
    <div id="leafmap"></div>
  </div>
  <!-- 自分の記録ナビ（左） -->
  <div class="nav-pair" id="nav-mine">
    <button class="nav-btn" id="mine-up">∧</button>
    <div class="nav-label">MY</div>
    <button class="nav-btn" id="mine-dn">∨</button>
    <div class="nav-count" id="nav-mine-info"></div>
  </div>
  <!-- みんなのダイジェスト（右） -->
  <div class="nav-pair" id="nav-digest">
    <button class="nav-btn" id="digest-up">∧</button>
    <div class="nav-label">ALL</div>
    <button class="nav-btn" id="digest-dn">∨</button>
    <div class="nav-count" id="nav-digest-info"></div>
  </div>
  <div id="btm">
    <button id="cam-btn" onclick="openCam()">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <div id="stats">
      <div class="st"><div class="sn" id="s-total">0</div><div class="sl">TOTAL</div></div>
      <div class="st"><div class="sn" id="s-sea">0</div><div class="sl">SEA</div></div>
      <div class="st"><div class="sn" id="s-city">0</div><div class="sl">CITY</div></div>
    </div>
  </div>
</div>

<!-- CAMERA -->
<div id="camv">
  <div id="campre">
    <video id="camvid" autoplay playsinline muted></video>
    <canvas id="camcanvas"></canvas>
    <div id="camfrm"><div id="camfrm-in"></div></div>
  </div>
  <div id="shtbar">
    <button id="backbtn" onclick="closeCam()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    <div id="shutter" onclick="takePhoto()"></div>
    <button id="gallbtn" onclick="document.getElementById('filein').click()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
  </div>
</div>

<!-- CONFIRM -->
<div id="confv">
  <div id="confimg"><img id="confpre" src="" alt="">
    <div id="jover">
      <div id="jbadge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--sea)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><span id="jtxt">解析完了</span></div>
      <div id="jitems"></div>
    </div>
  </div>
  <div id="confbtns">
    <button id="btn-retry" onclick="retake()">やり直す</button>
    <button id="btn-send" onclick="send()">記録する</button>
  </div>
</div>

<!-- LOADING -->
<div id="ldg"><div class="spin"></div><div id="ldgtxt">AI解析中...</div></div>

<!-- DONE -->
<div id="donev">
  <div id="done-rip"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke-width="2"/></svg></div>
  <div id="done-num">0</div>
  <div id="done-lbl">RECORDS</div>
  <div id="done-imp">
    <div class="imp-ln" id="imp-txt">記録されました</div>
    <div class="imp-ln" style="margin-top:6px;opacity:.6;font-size:11px">あなたの記録が海を守ります</div>
  </div>
  <button id="btn-back" onclick="backToMap()">地図に戻る</button>
</div>

<input type="file" id="filein" accept="image/*" onchange="onFile(this)">

<script>
// ページ読み込み後すぐにバックグラウンド処理開始
window.addEventListener('load', async ()=>{
  // Leafletが読み込まれたらすぐに地図とデータを準備
  const waitL = setInterval(()=>{
    if(typeof L !== 'undefined'){
      clearInterval(waitL);
      // 非表示のままLoadRecordsを実行（地図だけ先に作る）
      document.getElementById('app').style.visibility='hidden';
      document.getElementById('app').classList.add('show');
      loadRecords().then(()=>{
        document.getElementById('app').classList.remove('show');
        document.getElementById('app').style.visibility='';
        preloaded = true;
      });
    }
  }, 50);
});

const SB_URL = 'https://imqgpzgpytwvfkgscezn.supabase.co';

// ── ユーザー管理 ──
let currentUserId = null;
let currentNickname = null;
let authMode = 'login';

function getCookie(name){
  const m=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  return m?decodeURIComponent(m[2]):null;
}
function setCookie(name,val,days=365){
  const d=new Date();d.setTime(d.getTime()+days*864e5);
  document.cookie=name+'='+encodeURIComponent(val)+';expires='+d.toUTCString()+';path=/;SameSite=Lax';
}

function showLogin(){
  document.getElementById('ob-info').style.display='none';
  document.getElementById('ob-auth').style.display='block';
}

function switchTab(mode){
  authMode=mode;
  const btn=document.getElementById('ob-auth-btn');
  if(btn) btn.textContent=mode==='new'?'新規登録':'はじめる';
  const sub=document.getElementById('ob-sub-link');
  if(sub){
    sub.textContent='';
    const txt=document.createTextNode(mode==='new'?'アカウントあり？ ':'はじめて？ ');
    const a=document.createElement('a');
    a.href='#';
    a.textContent=mode==='new'?'ログイン':'新規登録';
    a.style.color='rgba(170,221,238,.5)';
    a.onclick=function(e){e.preventDefault();switchTab(mode==='new'?'login':'new');};
    sub.appendChild(txt);
    sub.appendChild(a);
  }
  document.getElementById('ob-auth-err').style.display='none';
}

async function doAuth(){
  const nick=document.getElementById('inp-nick').value.trim();
  const pin=document.getElementById('inp-pin').value.trim();
  const errEl=document.getElementById('ob-auth-err');
  errEl.style.display='none';
  const pinClean=pin.replace(/\D/g,''); // 数字以外を除去
  if(!nick){errEl.textContent='ニックネームを入力してください';errEl.style.display='block';return;}
  if(pinClean.length!==4){errEl.textContent='PINは4桁の数字です';errEl.style.display='block';return;}
  document.getElementById('ob-auth-btn').textContent='確認中...';
  try{
    if(authMode==='new'){
      const existing=await sb('users?nickname=eq.'+encodeURIComponent(nick)+'&select=id');
      if(Array.isArray(existing)&&existing.length>0){
        errEl.textContent='このニックネームはすでに使われています';errEl.style.display='block';
        document.getElementById('ob-auth-btn').textContent='はじめる';return;
      }
      const result=await sb('users','POST',{nickname:nick,pin:pinClean,total_records:0});
      const user=Array.isArray(result)?result[0]:result;
      currentUserId=user.id;currentNickname=nick;
    } else {
      const result=await sb('users?nickname=eq.'+encodeURIComponent(nick)+'&pin=eq.'+encodeURIComponent(pinClean)+'&select=id,nickname');
      if(!Array.isArray(result)||result.length===0){
        errEl.textContent='ニックネームまたはPINが違います';errEl.style.display='block';
        document.getElementById('ob-auth-btn').textContent='はじめる';return;
      }
      currentUserId=result[0].id;currentNickname=result[0].nickname;
    }
    setCookie('umi_uid',currentUserId);
    setCookie('umi_nick',currentNickname);
    try{localStorage.setItem('umi_uid',currentUserId);localStorage.setItem('umi_nick',currentNickname);}catch(e){}
    startApp();
  }catch(e){
    errEl.textContent='エラーが発生しました。もう一度お試しください。';
    errEl.style.display='block';
    document.getElementById('ob-auth-btn').textContent=authMode==='new'?'新規登録':'はじめる';
    console.error(e);
  }
}

async function restoreSession(){
  let uid=getCookie('umi_uid');
  let nick=getCookie('umi_nick');
  try{if(!uid)uid=localStorage.getItem('umi_uid');if(!nick)nick=localStorage.getItem('umi_nick');}catch(e){}
  if(uid&&nick){
    try{
      const result=await sb('users?id=eq.'+uid+'&select=id,nickname');
      if(Array.isArray(result)&&result.length>0){
        currentUserId=uid;currentNickname=nick;return true;
      }
    }catch(e){}
  }
  return false;
}

// ── SUPABASE ──
async function sb(path, method='GET', body=null){
  const h = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
  if(method==='POST') h['Prefer']='return=representation';
  const r = await fetch(SB_URL+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):null});
  if(!r.ok) throw new Error(await r.text());
  return r.json().catch(()=>({}));
}

async function upload(blob){
  const name='record_'+Date.now()+'.jpg';
  const r = await fetch(SB_URL+'/storage/v1/object/images/'+name,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'image/jpeg'},
    body:blob
  });
  if(!r.ok) throw new Error('upload failed');
  return SB_URL+'/storage/v1/object/public/images/'+name;
}

function initMap(clat, clng, zoom){
  if(lmap) return; // すでに初期化済みなら何もしない
  lmap = L.map('leafmap',{center:[clat,clng],zoom:zoom||13,minZoom:2,maxZoom:19,zoomControl:true,attributionControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:19,
    maxNativeZoom:19
  }).addTo(lmap);
}

async function loadRecords(){
  markerMap = {}; // リセット
  try{
    const data = await sb('records?select=*&order=created_at.desc&limit=500');
    preloaded = true;
    let sea=0,city=0,slat=0,slng=0,cnt=0;
    if(Array.isArray(data)){
      data.forEach(r=>{
        const c=(r.category||'').toUpperCase();
        if(c==='SEA'||c==='RIVER') sea++;
        if(c==='CITY'||c==='GROUND') city++;
        if(r.lat&&r.lng){slat+=r.lat;slng+=r.lng;cnt++;}
      });
      window.allRecords=data;
      total=data.length;
      setTimeout(buildNavRecs, 100);
      document.getElementById('cnt-num').textContent=total;
      document.getElementById('s-total').textContent=total;
      document.getElementById('s-sea').textContent=sea;
      document.getElementById('s-city').textContent=city;
      const clat=cnt>0?slat/cnt:35.316;
      const clng=cnt>0?slng/cnt:139.473;
      initMap(clat,clng,cnt>0?14:10);
      data.forEach(r=>addPin(r));
    } else {
      initMap(35.316,139.473,13);
    }
  }catch(e){
    console.error(e);
    initMap(35.316,139.473,13);
  }
}

// ── ナビゲーション ──
let mineIdx=0, digestIdx=0;
let mineRecs=[], digestRecs=[];

function buildNavRecs(){
  if(!window.allRecords) return;
  mineRecs = window.allRecords
    .filter(r=>r.user_id===currentUserId&&r.lat&&r.lng)
    .sort((a,b)=>new Date(a.photo_taken_at||a.created_at)-new Date(b.photo_taken_at||b.created_at));
  digestRecs = window.allRecords
    .filter(r=>r.user_id!==currentUserId&&r.lat&&r.lng)
    .sort((a,b)=>{
      const sc={高:3,中:2,低:1};
      const d=(sc[b.mp_risk]||0)-(sc[a.mp_risk]||0);
      return d!==0?d:new Date(b.created_at)-new Date(a.created_at);
    });
  mineIdx=0; digestIdx=0;
  updateNavInfo('mine');
  updateNavInfo('digest');
}

function updateNavInfo(type){
  const recs=type==='mine'?mineRecs:digestRecs;
  const idx=type==='mine'?mineIdx:digestIdx;
  const el=document.getElementById('nav-'+type+'-info');
  if(!el) return;
  if(recs.length===0){ el.textContent=''; return; }
  el.textContent=(idx+1)+'/'+recs.length;
}

function goTo(type, idx){
  const recs=type==='mine'?mineRecs:digestRecs;
  if(!recs||recs.length===0){
 return; }
  idx=((idx%recs.length)+recs.length)%recs.length;
  if(type==='mine') mineIdx=idx;
  else digestIdx=idx;
  updateNavInfo(type);
  const r=recs[idx];
  if(!lmap||!r.lat||!r.lng) return;

  lmap.closePopup();

  const bounds=lmap.getBounds();
  const inView=bounds.contains(L.latLng(r.lat,r.lng));

  if(inView){
    setTimeout(()=>openMarkerPopup(r), 100);
  } else {
    lmap.flyTo([r.lat,r.lng],15,{animate:true,duration:0.6});
    setTimeout(()=>openMarkerPopup(r), 700);
  }
}

function openMarkerPopup(r){
  const marker = r.id ? markerMap[r.id] : null;
  if(!marker){
 return; }

  // フォーカスアニメーション
  const el = marker.getElement();
  if(el){
    const pin = el.querySelector('.umi-pin');
    if(pin){
      pin.style.transition='transform .2s,box-shadow .2s';
      pin.style.transform='scale(2.5)';
      pin.style.boxShadow='0 0 0 10px rgba(255,255,255,.25)';
      setTimeout(()=>{pin.style.transform='';pin.style.boxShadow='';}, 700);
    }
  }
  marker.openPopup();
}

function initNav(){
  // ボタンイベント
  const mu=document.getElementById('mine-up');
  const md=document.getElementById('mine-dn');
  const du=document.getElementById('digest-up');
  const dd=document.getElementById('digest-dn');
  if(mu) mu.addEventListener('click',()=>goTo('mine',mineIdx-1));
  if(md) md.addEventListener('click',()=>goTo('mine',mineIdx+1));
  if(du) du.addEventListener('click',()=>goTo('digest',digestIdx-1));
  if(dd) dd.addEventListener('click',()=>goTo('digest',digestIdx+1));

  // ホバースクロール
  ['nav-mine','nav-digest'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    const type=id==='nav-mine'?'mine':'digest';
    let last=0;
    el.addEventListener('wheel',(e)=>{
      e.preventDefault();
      const now=Date.now();
      if(now-last<300) return;
      last=now;
      goTo(type,(type==='mine'?mineIdx:digestIdx)+(e.deltaY>0?1:-1));
    },{passive:false});
    let ty=0;
    el.addEventListener('touchstart',(e)=>{ty=e.touches[0].clientY;},{passive:true});
    el.addEventListener('touchend',(e)=>{
      const d=ty-e.changedTouches[0].clientY;
      if(Math.abs(d)>30) goTo(type,(type==='mine'?mineIdx:digestIdx)+(d>0?1:-1));
    },{passive:true});
  });
}

// ── EXIF GPS ──
async function extractGPS(file){
  return new Promise(resolve=>{
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const view=new DataView(e.target.result);
        if(view.getUint16(0)!==0xFFD8){resolve(null);return;}
        let off=2;
        while(off<view.byteLength-4){
          const mk=view.getUint16(off);
          const sz=view.getUint16(off+2);
          if(mk===0xFFE1){resolve(parseGPS(view.buffer.slice(off+4,off+2+sz)));return;}
          if(sz<2) break;
          off+=2+sz;
        }
        resolve(null);
      }catch(e){resolve(null);}
    };
    rd.readAsArrayBuffer(file);
  });
}
function parseGPS(buf){
  try{
    const v=new DataView(buf),len=buf.byteLength;
    if(len<6) return null;
    const hdr=String.fromCharCode(v.getUint8(0),v.getUint8(1),v.getUint8(2),v.getUint8(3));
    if(hdr!=='Exif') return null;
    const t=6;
    const le=v.getUint16(t)===0x4949;
    const r16=o=>v.getUint16(t+o,le);
    const r32=o=>v.getUint32(t+o,le);
    const ifd=r32(4);
    if(t+ifd+2>len) return null;
    const n=r16(ifd);
    let go=-1;
    for(let i=0;i<n;i++){const b=ifd+2+i*12;if(t+b+12>len)break;if(r16(b)===0x8825){go=r32(b+8);break;}}
    if(go<0||t+go+2>len) return null;
    const gn=r16(go);
    let latR='N',lngR='E',lat=null,lng=null;
    const rat=o=>{if(o+8>len)return 0;const n=v.getUint32(o,le),d=v.getUint32(o+4,le);return d===0?0:n/d;};
    for(let i=0;i<gn;i++){
      const b=go+2+i*12;if(t+b+12>len)break;
      const tag=r16(b),vo=r32(b+8),ao=t+vo;
      if(tag===0x01&&ao<len) latR=String.fromCharCode(v.getUint8(ao));
      else if(tag===0x03&&ao<len) lngR=String.fromCharCode(v.getUint8(ao));
      else if((tag===0x02||tag===0x04)&&ao+24<=len){
        const deg=rat(ao)+rat(ao+8)/60+rat(ao+16)/3600;
        if(tag===0x02)lat=deg;else lng=deg;
      }
    }
    if(lat===null||lng===null) return null;
    return{lat:latR==='S'?-lat:lat,lng:lngR==='W'?-lng:lng};
  }catch(e){return null;}
}

// ── EXIF 撮影日 ──
async function extractPhotoDate(file){
  return new Promise(resolve=>{
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const view=new DataView(e.target.result);
        if(view.getUint16(0)!==0xFFD8){resolve(null);return;}
        let off=2;
        while(off<view.byteLength-4){
          const mk=view.getUint16(off);
          const sz=view.getUint16(off+2);
          if(mk===0xFFE1){
            const buf=e.target.result.slice(off+4,off+2+sz);
            resolve(parseDateFromExif(buf));
            return;
          }
          if(sz<2) break;
          off+=2+sz;
        }
        resolve(null);
      }catch(e){resolve(null);}
    };
    rd.readAsArrayBuffer(file);
  });
}

function parseDateFromExif(buffer){
  try{
    const view=new DataView(buffer);
    const len=buffer.byteLength;
    if(len<6) return null;
    const hdr=String.fromCharCode(view.getUint8(0),view.getUint8(1),view.getUint8(2),view.getUint8(3));
    if(hdr!=='Exif') return null;
    const t=6;
    const le=view.getUint16(t)===0x4949;
    const r16=o=>view.getUint16(t+o,le);
    const r32=o=>view.getUint32(t+o,le);
    const ifd=r32(4);
    if(t+ifd+2>len) return null;
    const n=r16(ifd);
    // DateTimeOriginal tag: 0x9003
    for(let i=0;i<n;i++){
      const b=ifd+2+i*12;
      if(t+b+12>len) break;
      const tag=r16(b);
      if(tag===0x9003){
        const vo=r32(b+8);
        // ASCII形式 "YYYY:MM:DD HH:MM:SS"
        let str='';
        for(let j=0;j<19;j++){
          const c=view.getUint8(t+vo+j);
          if(c===0) break;
          str+=String.fromCharCode(c);
        }
        if(str.length>=10){
          // "YYYY:MM:DD HH:MM:SS" → ISO形式に変換
          const iso=str.replace(/^(\d{4}):(\d{2}):(\d{2})/,'$1-$2-$3');
          return new Date(iso).toISOString();
        }
      }
    }
    return null;
  }catch(e){return null;}
}

// ── ANALYZE ──
async function analyze(){
  if(!userLat||!userLng){alert('この写真にはGPS情報が含まれていません。\n位置情報をオンにして撮影した写真を使ってください。');return;}
  showLoad('AI解析中...');
  try{
    const b64=capturedUrl.split(',')[1];
    const r=await fetch(EDGE_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY},body:JSON.stringify({imageBase64:b64,lat:userLat,lng:userLng,photoTakenAt:photoTakenAt})});
    if(!r.ok) throw new Error('AI解析失敗');
    analysisResult=await r.json();
    hideLoad();
    // ごみ判定
    if(analysisResult.is_trash === false){
      alert('ごみが見つかりませんでした。\n海岸・街中などで見つけたごみを撮影してください。');
      return;
    }
    showConfirm();
  }catch(e){hideLoad();alert('解析に失敗しました。もう一度お試しください。');console.error(e);}
}

      mp_risk:r.mp_risk,drift_days_est:r.drift_days_est,beach_days_est:r.beach_days_est,
      mp_years_est:r.mp_years_est,manufacturer:r.manufacturer,brand_name:r.brand_name,
      product_name:r.product_name,barcode:r.barcode,origin_country:r.origin_country,
      import_route:r.import_route,distributor:r.distributor,retailer_category:r.retailer_category,
      recyclable:r.recyclable,design_issue:r.design_issue,affected_species:r.affected_species,
      human_route:r.human_route,discharge_route:r.discharge_route,source_category:r.source_category,
      runoff_risk:r.runoff_risk,analysis_json:r};
    await sb('records','POST',rec);
    hideLoad();
    total++;
    document.getElementById('done-num').textContent=total;
    document.getElementById('cnt-num').textContent=total;
    document.getElementById('s-total').textContent=total;
    document.getElementById('imp-txt').textContent=r.summary||'記録されました';
    addPin({...rec,created_at:new Date().toISOString()});
    if(!window.allRecords) window.allRecords=[];
    const newRec={...rec,created_at:new Date().toISOString()};
    window.allRecords.unshift(newRec);
    if(newRec.id) markerMap[newRec.id]=null; // 後でaddPinで設定
    buildNavRecs();
    document.getElementById('donev').classList.add('show');
  }catch(e){hideLoad();alert('保存に失敗しました: '+e.message);console.error(e);}
}
function backToMap(){document.getElementById('donev').classList.remove('show');}

// ── LOADING ──
function showLoad(t){document.getElementById('ldgtxt').textContent=t;document.getElementById('ldg').classList.add('show');}
function hideLoad(){document.getElementById('ldg').classList.remove('show');}
</script>
